<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDC HCI — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  // Persistent client: keeps the login session so the dashboard stays
  // signed in across visits.
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #F0EEE6;
    font-family: ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif;
    color: #29261F;
    -webkit-font-smoothing: antialiased;
  }

  .page { min-height: 100vh; padding: 48px 32px; }
  .wrap { width: 100%; max-width: 880px; margin: 0 auto; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 12px; }

  h1 {
    font-family: Newsreader, Georgia, serif;
    font-weight: 400;
    font-size: 34px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .updated { font-size: 13px; color: #8A8578; }

  .refresh-btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: #29261F;
    background: transparent;
    border: 1px solid #D8D3C6;
    border-radius: 10px;
    padding: 8px 16px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .refresh-btn:hover { background: #E7E3D8; border-color: #C9C3B4; }
  .refresh-btn:disabled { opacity: 0.5; cursor: default; }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin: 32px 0;
  }

  .stat-card {
    background: #FAF9F5;
    border: 1px solid #E0DBCE;
    border-radius: 16px;
    padding: 20px;
  }

  .stat-label {
    font-size: 12px;
    font-weight: 500;
    color: #8A8578;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .stat-value {
    font-family: Newsreader, Georgia, serif;
    font-size: 32px;
    font-variant-numeric: tabular-nums;
  }


  .stat-sub {
    font-size: 12px;
    color: #8A8578;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }

  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 32px; }

  .panel {
    background: #FAF9F5;
    border: 1px solid #E0DBCE;
    border-radius: 16px;
    padding: 24px;
  }

  .panel h2 {
    font-family: Newsreader, Georgia, serif;
    font-weight: 400;
    font-size: 20px;
    margin: 0 0 18px;
  }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .bar-row:last-child { margin-bottom: 0; }

  .bar-label { width: 64px; font-size: 14px; color: #6B665A; flex-shrink: 0; }

  .bar-track {
    flex: 1;
    background: #EDE9DD;
    border-radius: 6px;
    height: 20px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: #C15F3C;
    border-radius: 6px;
    transition: width 0.4s ease;
    min-width: 2px;
  }

  .bar-count { width: 34px; text-align: right; font-size: 13px; color: #8A8578; font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .empty-note { color: #8A8578; font-size: 14px; }

  .events-scroll { overflow-x: auto; }

  /* Stage metric strip: the funnel and timings for the selected stage. */
  /* Column count is set per stage (--cols) so metrics land in even rows —
     six become 3x2, four become a single row of four — instead of leaving
     an orphan on the last row. */
  .stage-metrics {
    display: grid;
    grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 18px;
  }
  @media (max-width: 860px) { .stage-metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 470px) { .stage-metrics { grid-template-columns: minmax(0, 1fr); } }

  .metric {
    background: #FAF9F5;
    border: 1px solid #E5E1D4;
    border-radius: 10px;
    padding: 12px 14px;
  }

  .metric-label {
    font-size: 11px;
    font-weight: 500;
    color: #8A8578;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin-bottom: 5px;
  }

  .metric-value {
    font-family: Newsreader, Georgia, serif;
    font-size: 23px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }

  .metric-value.warn { color: #C15F3C; }

  .metric-sub {
    font-size: 11.5px;
    color: #8A8578;
    margin-top: 3px;
    font-variant-numeric: tabular-nums;
  }

  /* Choices sit above the heatmap, full width, so the preview keeps the
     entire panel width — squeezing it clips the screen being analysed. */
  .stage-choice {
    background: #FAF9F5;
    border: 1px solid #E5E1D4;
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 18px;
  }

  .stage-choice h3, .stage-heat h3 {
    font-size: 11px;
    font-weight: 500;
    color: #8A8578;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    margin: 0 0 12px;
  }

  .heatmap-tab .tab-metric {
    opacity: 0.72;
    font-weight: 400;
    margin-left: 5px;
    font-variant-numeric: tabular-nums;
  }

  .heatmap-tabs { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }

  .heatmap-tab {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: #6B665A;
    background: #F0EEE6;
    border: 1px solid #E0DBCE;
    border-radius: 999px;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .heatmap-tab:hover { border-color: #C9A491; }
  .heatmap-tab.active { background: #C15F3C; border-color: #C15F3C; color: #FAF9F5; }

  .heatmap-canvas {
    width: 100%;
    height: 100%;
    display: block;
    position: relative;
    z-index: 1;
    pointer-events: none;
  }

  .heatmap-frame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    pointer-events: none;
    background: #F0EEE6;
  }

  .heat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .heat-header h3 { margin: 0; }

  .heat-header-control { display: flex; align-items: center; gap: 10px; }

  /* Direct child only — otherwise this leaks into the checkbox labels
     inside the dropdown panel and uppercases them. */
  .heat-header-control > label {
    font-size: 11px;
    font-weight: 500;
    color: #8A8578;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  /* Multi-select dropdown: a summary button that opens a checkbox list.
     Used for both session and click-ordinal filtering — a flat chip row
     stops working once there are dozens of options. */
  .multiselect { position: relative; }

  .ms-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: space-between;
    min-width: 220px;
    max-width: 300px;
    font-family: inherit;
    font-size: 13px;
    text-align: left;
    padding: 7px 10px;
    border: 1px solid #D8D3C6;
    border-radius: 8px;
    background: #FFFFFF;
    color: #29261F;
    cursor: pointer;
  }
  .ms-toggle:hover { border-color: #C9A491; }
  .ms-toggle:focus-visible { outline: 2px solid #C15F3C; outline-offset: 1px; }
  .ms-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms-caret { color: #8A8578; font-size: 10px; flex-shrink: 0; }

  .ms-panel {
    position: absolute;
    z-index: 20;
    top: calc(100% + 4px);
    left: 0;
    min-width: 260px;
    max-width: 340px;
    background: #FFFFFF;
    border: 1px solid #D8D3C6;
    border-radius: 10px;
    box-shadow: 0 8px 24px rgba(41,38,31,0.12);
    padding: 8px;
  }

  .ms-search {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    padding: 6px 9px;
    border: 1px solid #E0DBCE;
    border-radius: 7px;
    margin-bottom: 6px;
  }
  .ms-search:focus { outline: 2px solid #C15F3C; outline-offset: 1px; }

  .ms-actions {
    display: flex;
    gap: 12px;
    padding: 0 4px 7px;
    border-bottom: 1px solid #F0EEE6;
    margin-bottom: 5px;
  }
  .ms-actions button {
    font-family: inherit;
    font-size: 12px;
    color: #C15F3C;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
  }
  .ms-actions button:hover { color: #A84F30; }

  .ms-options { max-height: 240px; overflow-y: auto; }

  .ms-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 6px;
    border-radius: 6px;
    font-size: 13px;
    cursor: pointer;
    line-height: 1.35;
  }
  .ms-option:hover { background: #F6F4EE; }
  .ms-option input { accent-color: #C15F3C; cursor: pointer; flex-shrink: 0; }
  .ms-option-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ms-none { font-size: 13px; color: #8A8578; padding: 6px; }

  /* Fixed height rather than an aspect ratio: the app's content column caps
     at 560px, so its height stops growing with width. A ratio on a wide
     panel makes the frame too short and clips the screen being analysed. */
  .heatmap-wrap {
    position: relative;
    height: 520px;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #E0DBCE;
  }
  @media (max-width: 620px) { .heatmap-wrap { height: 430px; } }
  .heatmap-wrap .empty-note {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .error-box {
    background: #F6E9E1;
    border: 1px solid #C15F3C;
    color: #8A3A1E;
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 14px;
    margin-bottom: 24px;
  }

  .signout-btn {
    font-family: inherit;
    font-size: 13px;
    color: #8A8578;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 4px 0;
    text-decoration: underline;
  }
  .signout-btn:hover { color: #29261F; }

  .login-page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .login-card {
    width: 100%;
    max-width: 340px;
    background: #FAF9F5;
    border: 1px solid #E0DBCE;
    border-radius: 16px;
    padding: 32px;
  }

  .login-card h1 { font-size: 24px; margin: 0 0 6px; }
  .login-card p { font-size: 14px; color: #6B665A; margin: 0 0 24px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: #6B665A; margin-bottom: 6px; }
  .field input {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    padding: 10px 12px;
    border: 1px solid #D8D3C6;
    border-radius: 8px;
    background: #FFFFFF;
    color: #29261F;
  }
  .field input:focus { outline: 2px solid #C15F3C; outline-offset: 1px; }

  .login-btn {
    width: 100%;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: #FAF9F5;
    background: #C15F3C;
    border: none;
    border-radius: 8px;
    padding: 11px;
    cursor: pointer;
    margin-top: 6px;
    transition: background 0.15s;
  }
  .login-btn:hover { background: #A84F30; }
  .login-btn:disabled { opacity: 0.6; cursor: default; }

  [hidden] { display: none !important; }

  .filter-bar {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    flex-wrap: wrap;
    background: #FAF9F5;
    border: 1px solid #E0DBCE;
    border-radius: 16px;
    padding: 16px 20px;
    margin-top: 20px;
  }

  .filter-field label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: #8A8578;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }

  .filter-field input, .filter-field select {
    font-family: inherit;
    font-size: 13px;
    padding: 7px 10px;
    border: 1px solid #D8D3C6;
    border-radius: 8px;
    background: #FFFFFF;
    color: #29261F;
  }
  .filter-field input:focus, .filter-field select:focus { outline: 2px solid #C15F3C; outline-offset: 1px; }

    font-family: inherit;
    font-size: 13px;
    color: #8A8578;

    border: none;
    cursor: pointer;
    padding: 7px 0;
    text-decoration: underline;
  }
  .clear-filters-btn:hover { color: #29261F; }

<body>

<div class="login-page" id="login-page" hidden>
  <div class="login-card">
    <h1>Dashboard login</h1>
    <p>Sign in with your Supabase account to view collected data.</p>
    <form id="login-form">
      <div class="field">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="login-btn">Sign in</button>
    </form>
    <div id="login-error"></div>
  </div>
</div>

<div class="page" id="dashboard-page" hidden>
  <div class="wrap">
    <header>
      <h1>Selector Flow — Dashboard</h1>
      <div style="display:flex; align-items:center; gap:14px;">
        <button class="refresh-btn" id="refresh-btn">Refresh</button>
        <button class="signout-btn" id="signout-btn">Sign out</button>
      </div>
    </header>
    <div class="updated" id="updated-label">Loading…</div>

    <div class="filter-bar">
      <div class="filter-field">
        <label for="filter-from">From</label>
        <input type="date" id="filter-from">
      </div>
      <div class="filter-field">
        <label for="filter-to">To</label>
        <input type="date" id="filter-to">
      </div>
      <div class="filter-field">
        <label for="filter-platform">Platform</label>
        <select id="filter-platform">
          <option value="all">All</option>
          <option value="desktop">Desktop</option>
          <option value="mobile">Mobile</option>
        </select>
      </div>
      <!-- Sessions is a cohort filter like Platform, not a heatmap control:
           it narrows every number on the page, so it belongs here. -->
      <div class="filter-field">
        <label id="ms-sessions-label">Sessions</label>
        <div class="multiselect" id="ms-sessions"></div>
      </div>
      <button class="clear-filters-btn" id="clear-filters-btn">Clear filters</button>
    </div>

    <div id="error-slot"></div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">Unique users</div>
        <div class="stat-value" id="stat-users">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Sessions started</div>
        <div class="stat-value" id="stat-started">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="stat-completed">—</div>
        <div class="stat-sub" id="stat-completed-sub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Restarted</div>
        <div class="stat-value" id="stat-restarted">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Mis-clicks</div>
        <div class="stat-value" id="stat-misclicks">—</div>
        <div class="stat-sub" id="stat-misclicks-sub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Time to complete</div>
        <div class="stat-value" id="stat-time">—</div>
        <div class="stat-sub" id="stat-time-sub"></div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Clicks to complete</div>
        <div class="stat-value" id="stat-clicks">—</div>
        <div class="stat-sub" id="stat-clicks-sub"></div>
      </div>
    </div>

    <!-- Everything stage-specific lives together: pick a stage and you get
         its funnel, timings, choices and heatmap in one place. Each tab
         carries its headline time so stages stay comparable at a glance. -->
    <div class="panel">
      <h2>By stage</h2>
      <div class="heatmap-tabs" id="heatmap-tabs">
        <button class="heatmap-tab active" data-step="number">Number</button>
        <button class="heatmap-tab" data-step="letter">Letter</button>
        <button class="heatmap-tab" data-step="shape">Shape</button>
        <button class="heatmap-tab" data-step="success">Success</button>
      </div>

      <div class="stage-metrics" id="stage-metrics"></div>

      <div class="stage-choice" id="stage-choice"></div>

      <div class="stage-heat">
        <!-- The ordinal filter only changes which dots are drawn, so it sits
             with the heatmap. It has to be above the frame rather than inside
             it: .heatmap-wrap clips its contents, which would cut off the
             open dropdown panel. -->
        <div class="heat-header">
          <h3>Click heatmap</h3>
          <div class="heat-header-control">
            <label id="ms-ordinals-label" for="ms-ordinals">Which click</label>
            <div class="multiselect" id="ms-ordinals"></div>
          </div>
        </div>

        <div class="heatmap-wrap">
          <iframe class="heatmap-frame" id="heatmap-frame" src="index.html?previewStep=number" tabindex="-1" title="Screen preview"></iframe>
          <canvas class="heatmap-canvas" id="heatmap-canvas"></canvas>
          <div class="empty-note" id="heatmap-empty" hidden>No clicks recorded yet for this step.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  function renderBars(containerId, counts, labels) {
    const container = document.getElementById(containerId);
    const max = Math.max(1, ...labels.map(l => counts[l] || 0));
    const total = labels.reduce((sum, l) => sum + (counts[l] || 0), 0);

    if (total === 0) {
      container.innerHTML = '<div class="empty-note">No data yet.</div>';
      return;
    }

    container.innerHTML = labels.map(label => {
      const count = counts[label] || 0;
      const pct = Math.round((count / max) * 100);
      return `
        <div class="bar-row">
          <div class="bar-label">${label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="bar-count">${count}</div>
        </div>`;
    }).join('');
  }

  function fmtDuration(ms) {
    if (ms == null) return '';
    return `${(ms / 1000).toFixed(1)}s`;
  }

  function stageStats(durations) {
    if (!durations.length) return null;
    const sorted = [...durations].sort((a, b) => a - b);
    const sum = sorted.reduce((s, v) => s + v, 0);
    const mid = Math.floor(sorted.length / 2);
    const median = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    return { avg: sum / sorted.length, median, min: sorted[0], max: sorted[sorted.length - 1], count: sorted.length };
  }

  const STEPS = ['number', 'letter', 'shape'];
  const STEP_OPTIONS = {
    number: ['1', '2', '3'],
    letter: ['A', 'B', 'C', 'D'],
    shape:  ['circle', 'triangle', 'square']
  };

  const fmtClicks = n => n == null ? '—' : n.toFixed(1);

  function misclickRate(clicks) {
    const classified = clicks.filter(c => c.hit != null);
    if (!classified.length) return null;
    return Math.round(classified.filter(c => c.hit === 'none').length / classified.length * 100);
  }

  // A participant can answer the same step more than once — pressing Back and
  // changing their mind. These two helpers hold the whole reading rule, so it
  // is stated once rather than re-derived at every call site:
  //
  //   the answer to a step  = its LATEST row
  //   progress through flow = how many DISTINCT steps have an answer
  //
  // Counting raw rows instead would inflate progress every time someone
  // revisited a step, and `.find()` would report the attempt they abandoned.
  function finalAnswer(session, step) {
    let latest = null;
    for (const p of session.selections) {
      if (p.step !== step) continue;
      if (!latest || new Date(p.created_at) >= new Date(latest.created_at)) latest = p;
    }
    return latest;
  }

  function stepsAnswered(session) {
    return new Set(session.selections.map(p => p.step)).size;
  }

  // Per-stage funnel, timings, clicks and choices. Computed once per load and
  // read by whichever stage tab is showing.
  function computeStages(sessions) {
    const out = {};

    STEPS.forEach((step, i) => {
      // A session reached step i once it cleared every step before it, so
      // "reached" counts people who saw the screen — including those who then
      // left. That difference is the drop-off.
      const reached = sessions.filter(s => stepsAnswered(s) >= i);
      const passed  = reached.filter(s => s.selections.some(p => p.step === step));

      // Time on a step sums every visit to it: a participant who backed out
      // and returned genuinely spent all of that time here.
      const durations = passed.map(s =>
        s.selections.filter(p => p.step === step).reduce((n, p) => n + p.duration_ms, 0));
      // Only count clicks for people who got past the stage — an abandoned
      // attempt would otherwise make a hard stage look effortless.
      const clickCounts = passed.map(s => s.clicks.filter(c => c.step === step).length);
      const stepClicks = reached.flatMap(s => s.clicks.filter(c => c.step === step));

      // Their answer is what they settled on, not what they first tried.
      const choices = {};
      passed.forEach(s => {
        const v = finalAnswer(s, step).value;
        choices[v] = (choices[v] || 0) + 1;
      });

      out[step] = {
        reached: reached.length,
        passed: passed.length,
        dropped: reached.length - passed.length,
        dropRate: reached.length ? Math.round((reached.length - passed.length) / reached.length * 100) : null,
        time: stageStats(durations),
        clicks: stageStats(clickCounts),
        misRate: misclickRate(stepClicks),
        choices,
        options: STEP_OPTIONS[step]
      };
    });

    // The terminal screen isn't a stage you pass — no duration, no choice.
    const finished = sessions.filter(s => stepsAnswered(s) === STEPS.length);
    const successClicks = finished.flatMap(s => s.clicks.filter(c => c.step === 'success'));
    out.success = {
      reached: finished.length,
      restarted: finished.filter(s => s.is_restart).length,
      clicks: stageStats(finished.map(s => s.clicks.filter(c => c.step === 'success').length)),
      misRate: misclickRate(successClicks),
      terminal: true
    };

    return out;
  }

  function metric(label, value, sub, warn) {
    return `<div class="metric">
      <div class="metric-label">${label}</div>
      <div class="metric-value${warn ? ' warn' : ''}">${value}</div>
      ${sub ? `<div class="metric-sub">${sub}</div>` : ''}
    </div>`;
  }

  function renderStage() {
    const step = currentHeatmapStep;
    const d = stageData[step];
    const metrics = document.getElementById('stage-metrics');
    const choice = document.getElementById('stage-choice');

    // Ordinals depend on the stage, so they're rebuilt here rather than at
    // load — switching tabs has to re-offer the right set.
    rebuildOrdinalOptions(lastData, step);

    if (!d) { metrics.innerHTML = ''; choice.innerHTML = ''; renderHeatmap(); return; }

    if (d.terminal) {
      metrics.style.setProperty('--cols', 4);   // four metrics, one clean row
      metrics.innerHTML =
        metric('Reached', d.reached, 'completed the flow') +
        metric('Restarted from here', d.restarted, d.reached ? `${Math.round(d.restarted / d.reached * 100)}% of finishers` : '') +
        metric('Clicks here', d.clicks ? fmtClicks(d.clicks.avg) : '—', d.clicks ? `median ${fmtClicks(d.clicks.median)}` : '') +
        metric('Mis-clicks', d.misRate == null ? '—' : `${d.misRate}%`, 'of clicks on this screen', d.misRate >= 50);
      choice.innerHTML = '<h3>Choices</h3><div class="empty-note">The success screen has no choice to make.</div>';
      renderHeatmap();
      return;
    }

    metrics.style.setProperty('--cols', 3);    // six metrics, two rows of three
    metrics.innerHTML =
      metric('Reached', d.reached, 'saw this screen') +
      metric('Passed', d.passed, d.reached ? `${100 - d.dropRate}% of those who reached it` : '') +
      metric('Dropped off', d.dropped, d.dropRate == null ? '' : `${d.dropRate}% left here`, d.dropRate >= 25) +
      metric('Time on step', d.time ? fmtDuration(d.time.avg) : '—',
             d.time ? `median ${fmtDuration(d.time.median)} · ${fmtDuration(d.time.min)}–${fmtDuration(d.time.max)}` : '') +
      metric('Clicks to pass', d.clicks ? fmtClicks(d.clicks.avg) : '—',
             d.clicks ? `median ${fmtClicks(d.clicks.median)}` : '') +
      metric('Mis-clicks', d.misRate == null ? '—' : `${d.misRate}%`, 'of clicks on this step', d.misRate >= 50);

    choice.innerHTML = '<h3>What they chose</h3><div id="stage-choice-bars"></div>';
    renderBars('stage-choice-bars', d.choices, d.options);

    renderHeatmap();
  }

  // Headline time on each tab keeps stages comparable even though only one
  // is open at a time — the thing a tabbed layout otherwise costs you.
  function renderTabLabels() {
    document.querySelectorAll('.heatmap-tab').forEach(btn => {
      const step = btn.dataset.step;
      const d = stageData[step];
      const name = step.charAt(0).toUpperCase() + step.slice(1);
      const m = d && !d.terminal && d.time ? `<span class="tab-metric">${fmtDuration(d.time.avg)}</span>` : '';
      btn.innerHTML = name + m;
    });
  }

  let allSessions = [];   // everything the date/platform query returned
  let lastData = [];      // the session cohort currently on screen
  let stageData = {};
  let currentHeatmapStep = 'number';

  // Reusable multi-select: a summary button that opens a checkbox list.
  // Selection is always explicit (every box ticked = everything shown), so
  // the control reads the same way whether there are 3 options or 300.
  function createMultiSelect(hostId, { allLabel, noneLabel, searchable = false, onChange }) {
    const host = document.getElementById(hostId);
    host.innerHTML = `
      <button type="button" class="ms-toggle" aria-haspopup="true" aria-expanded="false">
        <span class="ms-label"></span><span class="ms-caret" aria-hidden="true">▼</span>
      </button>
      <div class="ms-panel" hidden>
        ${searchable ? '<input type="search" class="ms-search" placeholder="Search…" aria-label="Filter options">' : ''}
        <div class="ms-actions">
          <button type="button" data-act="all">Select all</button>
          <button type="button" data-act="none">Clear</button>
        </div>
        <div class="ms-options"></div>
      </div>`;

    const toggle = host.querySelector('.ms-toggle');
    const panel = host.querySelector('.ms-panel');
    const labelEl = host.querySelector('.ms-label');
    const optionsEl = host.querySelector('.ms-options');
    const searchEl = host.querySelector('.ms-search');

    let options = [];                 // [{value, label}]
    const selected = new Set();       // explicit set of chosen values

    function paintLabel() {
      if (!options.length) { labelEl.textContent = noneLabel; return; }
      if (selected.size === options.length) { labelEl.textContent = `${allLabel} (${options.length})`; return; }
      if (selected.size === 0) { labelEl.textContent = 'None selected'; return; }
      if (selected.size <= 2) {
        labelEl.textContent = options.filter(o => selected.has(o.value)).map(o => o.label).join(', ');
        return;
      }
      labelEl.textContent = `${selected.size} of ${options.length} selected`;
    }

    function paintOptions() {
      const q = (searchEl?.value || '').trim().toLowerCase();
      const visible = q ? options.filter(o => o.label.toLowerCase().includes(q)) : options;
      optionsEl.innerHTML = visible.length
        ? visible.map(o => `
            <label class="ms-option">
              <input type="checkbox" value="${o.value}" ${selected.has(o.value) ? 'checked' : ''}>
              <span class="ms-option-text" title="${o.label}">${o.label}</span>
            </label>`).join('')
        : '<div class="ms-none">No matches</div>';
    }

    function open(next) {
      panel.hidden = !next;
      toggle.setAttribute('aria-expanded', String(next));
      if (next) { paintOptions(); searchEl?.focus(); }
    }

    toggle.addEventListener('click', () => open(panel.hidden));
    document.addEventListener('click', (e) => { if (!host.contains(e.target)) open(false); });
    host.addEventListener('keydown', (e) => { if (e.key === 'Escape') { open(false); toggle.focus(); } });
    searchEl?.addEventListener('input', paintOptions);

    optionsEl.addEventListener('change', (e) => {
      const box = e.target.closest('input[type="checkbox"]');
      if (!box) return;
      box.checked ? selected.add(box.value) : selected.delete(box.value);
      paintLabel();
      onChange();
    });

    host.querySelector('.ms-actions').addEventListener('click', (e) => {
      const act = e.target.dataset.act;
      if (!act) return;
      selected.clear();
      if (act === 'all') options.forEach(o => selected.add(o.value));
      paintOptions(); paintLabel(); onChange();
    });

    return {
      setOptions(list) {
        // Keep "everything selected" sticky across refreshes, so newly
        // arriving sessions/ordinals are included rather than silently
        // filtered out; otherwise preserve the user's explicit choice.
        const wasAll = options.length === 0 || selected.size === options.length;
        const hadSelection = selected.size > 0;
        options = list;
        const valid = new Set(list.map(o => o.value));
        [...selected].forEach(v => { if (!valid.has(v)) selected.delete(v); });
        if (wasAll) list.forEach(o => selected.add(o.value));
        // If narrowing the date range wiped out everything the user had
        // picked, fall back to all rather than leaving a blank dashboard
        // with no visible reason. A deliberate "Clear" still stays empty.
        if (hadSelection && selected.size === 0) list.forEach(o => selected.add(o.value));
        paintLabel();
        if (!panel.hidden) paintOptions();
      },
      // Select everything without firing onChange — the caller is already
      // about to re-render. Leaving it "all" also makes the next setOptions
      // treat newly arrived options as selected.
      selectAll() {
        selected.clear();
        options.forEach(o => selected.add(o.value));
        paintLabel();
        if (!panel.hidden) paintOptions();
      },
      has: (value) => selected.has(String(value)),
      isEmpty: () => options.length === 0
    };
  }

  // Sessions is a cohort filter: changing it re-derives every number on the
  // page from data already in hand, so it recomputes rather than re-fetching.
  const sessionFilter = createMultiSelect('ms-sessions', {
    allLabel: 'All sessions', noneLabel: 'No sessions', searchable: true,
    onChange: () => applyFilters()
  });

  // Ordinals only decide which dots are drawn — nothing else moves.
  const ordinalFilter = createMultiSelect('ms-ordinals', {
    allLabel: 'All clicks', noneLabel: 'No clicks yet',
    onChange: () => renderHeatmap()
  });

  const ordinalName = n => {
    const s = ['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th';
    return `${n}${s} click`;
  };

  // Built from everything the date/platform query returned, so any session
  // stays re-selectable even while the cohort is narrowed to one.
  function rebuildSessionOptions(sessions) {
    sessionFilter.setOptions(sessions.map(s => {
      const picks = STEPS
        .map(k => finalAnswer(s, k)?.value)
        .filter(Boolean).join(' · ');
      const when = new Date(s.started_at).toLocaleString(undefined,
        { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
      return { value: s.session_id, label: `${s.session_id.slice(0, 8)} — ${picks || 'no picks'} — ${when}` };
    }));
  }

  // Ordinals are scoped to the visible cohort *and* the stage on screen, so
  // the list only ever offers clicks that could actually be plotted. Someone
  // clicking ten times on one step shouldn't make the next step offer ten.
  function rebuildOrdinalOptions(sessions, step) {
    const stepClicks = sessions.flatMap(s => s.clicks.filter(c => c.step === step));

    // Take the ordinals genuinely present rather than counting to the max, so
    // a gap in the data shows up as a missing option instead of a dead choice.
    const present = [...new Set(stepClicks.map(c => c.seq).filter(n => n != null))]
      .sort((a, b) => a - b);
    const opts = present.map(n => ({ value: String(n), label: ordinalName(n) }));

    // Older clicks were logged before ordinals were recorded. Surface them
    // as their own choice so they can be included or excluded deliberately.
    if (stepClicks.some(c => c.seq == null)) {
      opts.push({ value: 'unknown', label: 'Unrecorded order (older data)' });
    }
    ordinalFilter.setOptions(opts);
  }

  // Where the preview's content column sits, in canvas pixels. Clicks are
  // stored relative to that column, so we project them onto the preview's
  // own column — that keeps a click on a button's left edge on that same
  // edge regardless of how big the visitor's window was. Falls back to
  // treating the whole canvas as the column if the preview isn't ready.
  function previewColumnRect(canvas) {
    const frame = document.getElementById('heatmap-frame');
    try {
      const fwin = frame.contentWindow;
      const wrap = fwin.document.querySelector('.wrap');
      if (!wrap) return null;
      const r = wrap.getBoundingClientRect();
      if (!r.width || !r.height) return null;
      const sx = canvas.width / fwin.innerWidth;
      const sy = canvas.height / fwin.innerHeight;
      return { left: r.left * sx, top: r.top * sy, width: r.width * sx, height: r.height * sy };
    } catch {
      return null; // preview still loading
    }
  }

  function renderHeatmap() {
    const canvas = document.getElementById('heatmap-canvas');

    // Match the backing store to the displayed size. Left at a fixed
    // resolution and stretched by CSS, the radial gradients would render as
    // ellipses and the dots would misrepresent where people clicked.
    const box = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    const wantW = Math.max(1, Math.round(box.width * dpr));
    const wantH = Math.max(1, Math.round(box.height * dpr));
    if (canvas.width !== wantW || canvas.height !== wantH) {
      canvas.width = wantW;
      canvas.height = wantH;
    }

    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;

    ctx.clearRect(0, 0, w, h);

    // lastData is already the selected cohort — the session filter is applied
    // once upstream so the dots and the numbers can never disagree.
    const points = lastData
      .flatMap(s => (s.clicks || []))
      .filter(c => c.step === currentHeatmapStep)
      // Clicks predating the seq column carry no ordinal. They get their own
      // "unrecorded" entry in the filter rather than being forced through it,
      // so selecting "1st click" really does show only first clicks.
      .filter(c => ordinalFilter.isEmpty() || ordinalFilter.has(c.seq == null ? 'unknown' : c.seq));

    document.getElementById('heatmap-empty').hidden = points.length > 0;

    const col = previewColumnRect(canvas) || { left: 0, top: 0, width: w, height: h };

    ctx.globalCompositeOperation = 'lighter';
    points.forEach(p => {
      const x = col.left + p.x * col.width;
      const y = col.top + p.y * col.height;
      // No clamping: margin clicks legitimately sit outside the column and
      // belong in the margin. The canvas clips anything past its edge.
      // Radius is in backing pixels, so scale it or dots shrink on retina.
      const r = 30 * dpr;
      const gradient = ctx.createRadialGradient(x, y, 0, x, y, r);
      gradient.addColorStop(0, 'rgba(193,95,60,0.55)');
      gradient.addColorStop(0.5, 'rgba(193,95,60,0.22)');
      gradient.addColorStop(1, 'rgba(193,95,60,0)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalCompositeOperation = 'source-over';
  }

  // The dots are positioned from the preview's layout, so redraw once it
  // has actually rendered — and again if the panel is resized.
  document.getElementById('heatmap-frame').addEventListener('load', renderHeatmap);
  window.addEventListener('resize', renderHeatmap);

  document.getElementById('heatmap-tabs').addEventListener('click', (e) => {
    const btn = e.target.closest('.heatmap-tab');
    if (!btn) return;
    document.querySelectorAll('.heatmap-tab').forEach(b => b.classList.toggle('active', b === btn));
    currentHeatmapStep = btn.dataset.step;
    document.getElementById('heatmap-frame').src = `index.html?previewStep=${currentHeatmapStep}`;
    renderStage();
  });

  async function loadDashboard() {
    const refreshBtn = document.getElementById('refresh-btn');
    const errorSlot = document.getElementById('error-slot');
    refreshBtn.disabled = true;
    errorSlot.innerHTML = '';

    const fromVal = document.getElementById('filter-from').value;
    const toVal = document.getElementById('filter-to').value;
    const platformVal = document.getElementById('filter-platform').value;

    // One query: sessions with their picks and clicks attached. The date
    // and platform filters live on the session, so children come along
    // already scoped — no client-side stitching, no second round trip.
    let query = supabaseClient
      .from('sessions')
      .select('session_id, user_id, platform, is_restart, started_at,'
            + ' selections(step, value, duration_ms, created_at),'
            + ' clicks(step, x, y, seq, hit)')
      .order('started_at', { ascending: true })
      .limit(5000);

    if (fromVal) query = query.gte('started_at', `${fromVal}T00:00:00.000Z`);
    if (toVal) query = query.lte('started_at', `${toVal}T23:59:59.999Z`);
    if (platformVal !== 'all') query = query.eq('platform', platformVal);

    const { data, error } = await query;

    refreshBtn.disabled = false;

    if (error) {
      errorSlot.innerHTML = `<div class="error-box">Couldn't load data: ${error.message}</div>`;
      document.getElementById('updated-label').textContent = 'Failed to load';
      return;
    }

    allSessions = data.map(s => ({ ...s, selections: s.selections || [], clicks: s.clicks || [] }));
    rebuildSessionOptions(allSessions);
    applyFilters();
  }

  // Everything below derives from data already fetched, so narrowing the
  // session cohort recomputes in place instead of hitting the network.
  function applyFilters() {
    const sessions = allSessions.filter(s => sessionFilter.has(s.session_id));

    // "Started" means the visitor actually made a pick; a session with no
    // selections is someone who opened the page and left.
    const started = sessions.filter(s => s.selections.length > 0);
    const completed = sessions.filter(s => stepsAnswered(s) === STEPS.length);
    const restarted = sessions.filter(s => s.is_restart);
    const rate = started.length > 0 ? Math.round((completed.length / started.length) * 100) : 0;
    const uniqueUsers = new Set(sessions.map(s => s.user_id)).size;

    // A mis-click is a click that hit nothing interactive. Clicks logged
    // before `hit` existed are left out entirely rather than guessed at —
    // counting them either way would be a made-up number.
    const allClicks = sessions.flatMap(s => s.clicks);
    const classified = allClicks.filter(c => c.hit != null);
    const misclicks = classified.filter(c => c.hit === 'none').length;
    const missRate = classified.length
      ? Math.round((misclicks / classified.length) * 100) : 0;

    // Start-to-finish totals, folded into the cards rather than sitting in a
    // table row — spread and median go in the sub-label so nothing is lost.
    // Sums every selection, revisits included: time spent on a choice they
    // later backed out of is still time they spent in the flow.
    const totalTime = stageStats(completed.map(s =>
      s.selections.reduce((n, p) => n + p.duration_ms, 0)));
    const totalClicks = stageStats(completed.map(s =>
      s.clicks.filter(c => STEPS.includes(c.step)).length));

    document.getElementById('stat-users').textContent = uniqueUsers;
    document.getElementById('stat-started').textContent = started.length;
    document.getElementById('stat-completed').textContent = completed.length;
    document.getElementById('stat-completed-sub').textContent = started.length
      ? `${rate}% of sessions started` : '';
    document.getElementById('stat-restarted').textContent = restarted.length;
    document.getElementById('stat-misclicks').textContent = misclicks;
    document.getElementById('stat-misclicks-sub').textContent = classified.length
      ? `${missRate}% of clicks`
      : (allClicks.length ? 'not recorded yet' : '');

    document.getElementById('stat-time').textContent = totalTime ? fmtDuration(totalTime.avg) : '—';
    document.getElementById('stat-time-sub').textContent = totalTime
      ? `median ${fmtDuration(totalTime.median)} · ${fmtDuration(totalTime.min)}–${fmtDuration(totalTime.max)}` : '';
    document.getElementById('stat-clicks').textContent = totalClicks ? fmtClicks(totalClicks.avg) : '—';
    document.getElementById('stat-clicks-sub').textContent = totalClicks
      ? `median ${fmtClicks(totalClicks.median)} · ${totalClicks.min}–${totalClicks.max}` : '';

    lastData = sessions;
    stageData = computeStages(sessions);
    renderTabLabels();
    renderStage();   // rebuilds the ordinal options for the current stage

    // Say when the view is narrowed, so a small number never looks like
    // "we only collected this much".
    const narrowed = sessions.length !== allSessions.length
      ? ` (filtered from ${allSessions.length})` : '';
    document.getElementById('updated-label').textContent =
      `Updated ${new Date().toLocaleTimeString()} · ${sessions.length} sessions${narrowed} · ${allClicks.length} clicks`;
  }

  document.getElementById('refresh-btn').addEventListener('click', loadDashboard);
  document.getElementById('filter-from').addEventListener('change', loadDashboard);
  document.getElementById('filter-to').addEventListener('change', loadDashboard);
  document.getElementById('filter-platform').addEventListener('change', loadDashboard);
  document.getElementById('clear-filters-btn').addEventListener('click', () => {
    document.getElementById('filter-from').value = '';
    document.getElementById('filter-to').value = '';
    document.getElementById('filter-platform').value = 'all';
    // Sessions is one of the filters now, so clearing has to reset it too.
    sessionFilter.selectAll();
    loadDashboard();
  });

  function showLogin() {
    document.getElementById('dashboard-page').hidden = true;
    document.getElementById('login-page').hidden = false;
  }

  function showDashboard() {
    document.getElementById('login-page').hidden = true;
    document.getElementById('dashboard-page').hidden = false;
    loadDashboard();
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const loginBtn = document.getElementById('login-btn');
    const errorSlot = document.getElementById('login-error');
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    loginBtn.disabled = true;
    errorSlot.innerHTML = '';

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    loginBtn.disabled = false;

    if (error) {
      errorSlot.innerHTML = `<div class="error-box">${error.message}</div>`;
      return;
    }
    showDashboard();
  });

  document.getElementById('signout-btn').addEventListener('click', async () => {
    await supabaseClient.auth.signOut();
    showLogin();
  });

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      showDashboard();
    } else {
      showLogin();
    }
  })();
</script>
</body>
</html>
