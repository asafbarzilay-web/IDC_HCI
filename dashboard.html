<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDC HCI — Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #F0EEE6;
    font-family: ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif;
    color: #29261F;
    -webkit-font-smoothing: antialiased;
  }

  .page { min-height: 100vh; padding: 48px 32px; }
  .wrap { width: 100%; max-width: 880px; margin: 0 auto; }

  header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; flex-wrap: wrap; gap: 12px; }

  h1 {
    font-family: Newsreader, Georgia, serif;
    font-weight: 400;
    font-size: 34px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .updated { font-size: 13px; color: #8A8578; }

  .refresh-btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: #29261F;
    background: transparent;
    border: 1px solid #D8D3C6;
    border-radius: 10px;
    padding: 8px 16px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  .refresh-btn:hover { background: #E7E3D8; border-color: #C9C3B4; }
  .refresh-btn:disabled { opacity: 0.5; cursor: default; }

  .stat-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin: 32px 0;
  }

  .stat-card {
    background: #FAF9F5;
    border: 1px solid #E0DBCE;
    border-radius: 16px;
    padding: 20px;
  }

  .stat-label {
    font-size: 12px;
    font-weight: 500;
    color: #8A8578;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .stat-value {
    font-family: Newsreader, Georgia, serif;
    font-size: 32px;
    font-variant-numeric: tabular-nums;
  }

  .stat-value.accent { color: #C15F3C; }

  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; margin-bottom: 32px; }

  .panel {
    background: #FAF9F5;
    border: 1px solid #E0DBCE;
    border-radius: 16px;
    padding: 24px;
  }

  .panel h2 {
    font-family: Newsreader, Georgia, serif;
    font-weight: 400;
    font-size: 20px;
    margin: 0 0 18px;
  }

  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .bar-row:last-child { margin-bottom: 0; }

  .bar-label { width: 64px; font-size: 14px; color: #6B665A; flex-shrink: 0; }

  .bar-track {
    flex: 1;
    background: #EDE9DD;
    border-radius: 6px;
    height: 20px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: #C15F3C;
    border-radius: 6px;
    transition: width 0.4s ease;
    min-width: 2px;
  }

  .bar-count { width: 34px; text-align: right; font-size: 13px; color: #8A8578; font-variant-numeric: tabular-nums; flex-shrink: 0; }

  .empty-note { color: #8A8578; font-size: 14px; }

  .events-panel table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .events-panel th, .events-panel td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #E5E1D4; }
  .events-panel th { color: #8A8578; font-weight: 500; text-transform: uppercase; letter-spacing: 0.04em; font-size: 11px; }
  .events-panel td { color: #29261F; }
  .events-scroll { overflow-x: auto; }

  .error-box {
    background: #F6E9E1;
    border: 1px solid #C15F3C;
    color: #8A3A1E;
    border-radius: 12px;
    padding: 16px 20px;
    font-size: 14px;
    margin-bottom: 24px;
  }
</style>
</head>
<body>

<div class="page">
  <div class="wrap">
    <header>
      <h1>Selector Flow — Dashboard</h1>
      <button class="refresh-btn" id="refresh-btn">Refresh</button>
    </header>
    <div class="updated" id="updated-label">Loading…</div>

    <div id="error-slot"></div>

    <div class="stat-row">
      <div class="stat-card">
        <div class="stat-label">Sessions started</div>
        <div class="stat-value" id="stat-started">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="stat-completed">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completion rate</div>
        <div class="stat-value accent" id="stat-rate">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Restarted</div>
        <div class="stat-value" id="stat-restarted">—</div>
      </div>
    </div>

    <div class="panels">
      <div class="panel">
        <h2>Number</h2>
        <div id="chart-number"></div>
      </div>
      <div class="panel">
        <h2>Letter</h2>
        <div id="chart-letter"></div>
      </div>
      <div class="panel">
        <h2>Shape</h2>
        <div id="chart-shape"></div>
      </div>
    </div>

    <div class="panel events-panel">
      <h2>Recent events</h2>
      <div class="events-scroll">
        <table>
          <thead>
            <tr><th>Time</th><th>Session</th><th>Event</th><th>Value</th></tr>
          </thead>
          <tbody id="events-body"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
  function renderBars(containerId, counts, labels) {
    const container = document.getElementById(containerId);
    const max = Math.max(1, ...labels.map(l => counts[l] || 0));
    const total = labels.reduce((sum, l) => sum + (counts[l] || 0), 0);

    if (total === 0) {
      container.innerHTML = '<div class="empty-note">No data yet.</div>';
      return;
    }

    container.innerHTML = labels.map(label => {
      const count = counts[label] || 0;
      const pct = Math.round((count / max) * 100);
      return `
        <div class="bar-row">
          <div class="bar-label">${label}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="bar-count">${count}</div>
        </div>`;
    }).join('');
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    return d.toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }

  async function loadDashboard() {
    const refreshBtn = document.getElementById('refresh-btn');
    const errorSlot = document.getElementById('error-slot');
    refreshBtn.disabled = true;
    errorSlot.innerHTML = '';

    const { data, error } = await supabaseClient
      .from('events')
      .select('session_id, event_type, value, created_at')
      .order('id', { ascending: true })
      .limit(10000);

    refreshBtn.disabled = false;

    if (error) {
      errorSlot.innerHTML = `<div class="error-box">Couldn't load data: ${error.message}</div>`;
      document.getElementById('updated-label').textContent = 'Failed to load';
      return;
    }

    const bySession = {};
    data.forEach(row => {
      if (!bySession[row.session_id]) bySession[row.session_id] = {};
      bySession[row.session_id][row.event_type] = row.value;
    });

    const sessions = Object.values(bySession);
    const startedCount = sessions.filter(s => s.select_number !== undefined).length;
    const completedCount = sessions.filter(s => s.complete !== undefined).length;
    const restartedCount = sessions.filter(s => s.restart !== undefined).length;
    const rate = startedCount > 0 ? Math.round((completedCount / startedCount) * 100) : 0;

    document.getElementById('stat-started').textContent = startedCount;
    document.getElementById('stat-completed').textContent = completedCount;
    document.getElementById('stat-rate').textContent = `${rate}%`;
    document.getElementById('stat-restarted').textContent = restartedCount;

    const numberCounts = {}, letterCounts = {}, shapeCounts = {};
    sessions.forEach(s => {
      if (s.select_number) numberCounts[s.select_number] = (numberCounts[s.select_number] || 0) + 1;
      if (s.select_letter) letterCounts[s.select_letter] = (letterCounts[s.select_letter] || 0) + 1;
      if (s.select_shape) shapeCounts[s.select_shape] = (shapeCounts[s.select_shape] || 0) + 1;
    });

    renderBars('chart-number', numberCounts, ['1', '2', '3']);
    renderBars('chart-letter', letterCounts, ['A', 'B', 'C', 'D']);
    renderBars('chart-shape', shapeCounts, ['circle', 'triangle', 'square']);

    const recent = data.slice(-25).reverse();
    document.getElementById('events-body').innerHTML = recent.length
      ? recent.map(row => `
          <tr>
            <td>${fmtTime(row.created_at)}</td>
            <td>${row.session_id.slice(0, 8)}</td>
            <td>${row.event_type}</td>
            <td>${row.value ?? ''}</td>
          </tr>`).join('')
      : '<tr><td colspan="4" class="empty-note">No events yet.</td></tr>';

    document.getElementById('updated-label').textContent = `Updated ${new Date().toLocaleTimeString()} · ${data.length} total events`;
  }

  document.getElementById('refresh-btn').addEventListener('click', loadDashboard);
  loadDashboard();
</script>
</body>
</html>
