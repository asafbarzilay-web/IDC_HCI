<!--
  Republic of Marenta passport service — a clickable, self-contained website
  recreated from the Claude Design handoff Passport_Application_Form.html
  (a bundled x-dc prototype: React + the dc-runtime + 1.1 MB of base64 fonts,
  reassembled at load time from blob URLs).

  Marenta is invented. Every name, reference number, fee and office in here is
  prototype copy, not a real government service.

  What changed on the way out of the bundle, and why:

  * No React, no bundler. The prototype's markup is kept verbatim in the
    <template> below — the same sc-if / sc-for / {{ }} / style-hover source the
    handoff shipped — and ~150 lines of vanilla JS at the bottom compile it
    once into real DOM. That drops the page from 1.1 MB to ~110 KB and lets it
    be served as one static file.

  * Bindings update in place instead of re-rendering. The handoff re-rendered
    through React on every setState; here each {{ }} hole keeps its own node
    and only that node is written. So the four screens stay mounted and hidden
    (display:none), and anything typed into the form survives moving between
    them — which the React version did not manage across screen switches.

  * Fonts come from Google Fonts rather than 1 MB of inlined woff2, matching
    the other apps in this repo.

  * The screen lives in location.hash (#apply, #account, #appointment,
    #confirmation), so a screen can be linked to and the back button works.

  * Wired up, because they were dead ends in a handoff meant to be clicked:
    the three "Edit" links in section 08 and "Go to section 05" on the account
    screen now jump to their section, and the photograph slot accepts a real
    file by click or drag (Replace / Remove drive it).

  * Checkboxes and radios marked defaultChecked in the handoff are actually
    checked here. Serialising the prototype lowercased the attribute to
    "defaultchecked", which React then dropped, so the bundle rendered an
    eligibility form with none of its own answers selected. The attribute is
    honoured here, which is what the surrounding copy ("You are eligible to
    apply", the prefilled names) describes.

  * Still inert, as in the handoff: Guidance / Contact, the document View /
    Replace / Choose file buttons, the calendar's month arrows, Download PDF,
    Withdraw, Add to calendar, and the footer links.
-->

.photo-slot .sub u{text-underline-offset:2px}
.photo-slot .ring{position:absolute;inset:0;pointer-events:none;border:1.5px dashed currentColor;opacity:.35}
.photo-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.photo-slot.is-filled .empty,.photo-slot.is-filled .ring{display:none}
.photo-slot.is-over{outline:2px solid #7b2230;outline-offset:-2px;background:rgba(123,34,48,.08)}
.photo-slot.is-over .ring{border-color:#7b2230;opacity:1}
.photo-slot:focus-visible{outline:2px solid #1c2c4c;outline-offset:-2px}

/* ---- the switcher is pinned to the bottom edge; clear a phone's home bar ---- */
[style*="position:fixed;left:50%;bottom:20px"]{bottom:calc(20px + env(safe-area-inset-bottom,0px))!important}

  [style*="gap:56px"]{gap:0!important}

<script>
/* ===========================================================================
   mini-dc — the slice of the design-tool runtime this page actually needs.

   The handoff's markup is a template language: {{ path }} holes in text and
   attributes, <sc-if> / <sc-for> for control flow, style-hover / style-focus
   for pseudo-states, sc-camel-* for attributes HTML would have lowercased
   (sc-camel-on-click -> onClick, sc-camel-default-value -> defaultValue).
   The original shipped React to interpret it. This does the same job in one
   pass: compile() builds the DOM once and collects one updater per hole, and
   render() re-runs just those updaters. Nothing is unmounted, so the four
   screens and everything typed into the form survive every state change.
   =========================================================================== */
(function () {
'use strict';

/* Tags the editor rewrites to keep them out of the HTML parser's table and

var RAW = {

  'sc-raw-tfoot':'tfoot','sc-raw-tr':'tr','sc-raw-td':'td','sc-raw-th':'th','sc-raw-caption':'caption'
};
var DROP = {'hint-placeholder-val':1,'hint-placeholder-count':1,'hint-size':1,'data-dc-tpl':1,'sc-name':1,'x-length':1};

/* style-hover="border-color:#1c2c4c" becomes a generated class, since the
   prototype styles everything inline and inline styles have no :hover. Every
   declaration is marked !important, because the element it lands on always
   carries an inline style that would otherwise outrank the class. */
var sheet = document.createElement('style');
document.head.appendChild(sheet);
var pseudoSeen = {}, pseudoN = 0;
function importantify(css) {
  return css.split(';').map(function (d) {
    d = d.trim();
    if (!d || d.indexOf('!important') !== -1) return d;
    return d + ' !important';

}
function pseudoClass(pseudo, decl) {
  var key = pseudo + '{' + decl;
  if (!pseudoSeen[key]) {
    pseudoSeen[key] = 'ps' + (++pseudoN);
    var element = pseudo === 'before' || pseudo === 'after';
    var rule = '.' + pseudoSeen[key] + (element ? '::' : ':') + pseudo +

    } catch (e) { /* a declaration the browser rejects is not worth a broken page */ }

function resolve(vals, path) {
  var p = path.trim();
  if (p === 'true') return true;
  if (p === 'false') return false;
  var parts = p.split('.'), cur = vals;
  for (var i = 0; i < parts.length; i++) {

    cur = cur[parts[i]];

/* "{{ n1.click }}" yields the value itself (a function, a number); anything

  if (whole) return function (v) { return resolve(v, whole[1]); };
  if (raw.indexOf('{{') === -1) return function () { return raw; };

var VALS = {};   /* what the template renders against, rebuilt by render() */

function compile(node, ups, scope) {

  if (node.nodeType !== 1) return null;

    if (name === 'defaultchecked' || name === 'default-checked') { el.setAttribute('checked', ''); continue; }

    var x = resolve(v, path);

    if (built) parent.appendChild(built);
  }

  appendKids(node, box, ups, scope);
  ups.push(function (v) { box.style.display = get(v) ? 'contents' : 'none'; });

      });

    });

    '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>' +
    '<path d="m21 15-5-5L5 21"/></svg>';

  var el = document.createElement('div');
  el.className = 'photo-slot';
  el.tabIndex = 0;
  el.setAttribute('role', 'button');
  var label = node.getAttribute('placeholder') || 'Drop an image';
  el.setAttribute('aria-label', label);

  var empty = document.createElement('div');
  empty.className = 'empty';
  empty.innerHTML = ICON + '<div class="cap"></div><div class="sub">or <u>browse files</u></div>';
  empty.querySelector('.cap').textContent = label;
  el.appendChild(empty);

  var ring = document.createElement('div');
  ring.className = 'ring';
  el.appendChild(ring);

  var file = document.createElement('input');
  file.type = 'file';
  file.accept = 'image/*';
  file.style.display = 'none';
  el.appendChild(file);

  var url = null;
  function show(f) {
    if (!f || f.type.indexOf('image/') !== 0) return;
    if (url) URL.revokeObjectURL(url);
    url = URL.createObjectURL(f);
    var img = el.querySelector('img') || el.insertBefore(document.createElement('img'), empty);
    img.src = url;
    img.alt = 'The photograph you chose';
    el.classList.add('is-filled');
  }
  function clear() {
    if (url) { URL.revokeObjectURL(url); url = null; }
    var img = el.querySelector('img');
    if (img) img.remove();
    el.classList.remove('is-filled');
    file.value = '';
  }

  el.addEventListener('click', function (e) { if (e.target !== file) file.click(); });
  el.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); file.click(); }
  });
  file.addEventListener('change', function () { show(file.files && file.files[0]); });
  el.addEventListener('dragover', function (e) { e.preventDefault(); el.classList.add('is-over'); });
  el.addEventListener('dragleave', function () { el.classList.remove('is-over'); });
  el.addEventListener('drop', function (e) {
    e.preventDefault();
    el.classList.remove('is-over');
    show(e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]);
  });

  var id = node.getAttribute('id');
  if (id) { el.id = id; slots[id] = { open: function () { file.click(); }, clear: clear }; }
  return el;
}

/* ===========================================================================
   The application itself — the handoff's component logic, minus React.
   =========================================================================== */

/* Screens are addressable, so a link can point at one and Back works. */
var SCREEN_OF_HASH = {apply:'apply', account:'dashboard', appointment:'appointment', confirmation:'confirmation'};
var HASH_OF_SCREEN = {apply:'apply', dashboard:'account', appointment:'appointment', confirmation:'confirmation'};
function screenFromHash() {
  return SCREEN_OF_HASH[(location.hash || '').replace(/^#/, '')] || null;
}

var SECTIONS = ['s1','s2','s3','s4','s5','s6','s7','s8'];

var state = {
  screen: screenFromHash() || 'apply',
  urgency: 'standard',
  delivery: 'collect',
  pay: 'card',
  office: 'central',
  day: 22,
  slot: '10:20',
  declared: false,
  active: 's1'
};

var ups = [];
function setState(patch) {
  for (var k in patch) state[k] = patch[k];
  render();
}

function go(screen) {
  var hash = '#' + HASH_OF_SCREEN[screen];
  if (location.hash !== hash) location.hash = hash;   /* hashchange finishes the move */
  else if (state.screen !== screen) setState({screen: screen});
  window.scrollTo({top: 0});
}

window.addEventListener('hashchange', function () {
  var next = screenFromHash();
  if (next && next !== state.screen) { setState({screen: next}); window.scrollTo({top: 0}); }
});

function jump(id) {
  var el = document.getElementById(id);
  if (!el) return;
  window.scrollBy({top: el.getBoundingClientRect().top - 86, behavior: 'smooth'});
  setState({active: id});
}

/* Which section the reader is in, for the sidebar's current marker. */
function spy() {
  if (state.screen !== 'apply') return;
  var active = SECTIONS[0], found = false;
  SECTIONS.forEach(function (id) {
    var el = document.getElementById(id);
    if (el && el.getBoundingClientRect().top - 150 <= 0) { active = id; found = true; }
  });
  if (!found) active = SECTIONS[0];
  if (active !== state.active) setState({active: active});
}

function money(n) { return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* October 2026: the 1st falls on a Thursday, and the office has nothing free
   before the 22nd or at a weekend. */
function calendar() {
  var names = ['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  var out = [];
  for (var i = 0; i < 3; i++) out.push({label:'', bg:'transparent', bc:'transparent', fg:'transparent', click:function(){}});
  for (var n = 1; n <= 31; n++) {
    var col = (3 + n - 1) % 7;
    var open = n >= 22 && col < 5;
    var sel = open && n === state.day;
    out.push({
      label: String(n),
      weekday: names[col],
      bg: sel ? '#1c2c4c' : open ? '#ffffff' : '#f0ede5',
      bc: sel ? '#1c2c4c' : open ? '#cfc9bb' : '#f0ede5',
      fg: sel ? '#ffffff' : open ? '#14181f' : '#86816f',
      click: open ? (function (d) { return function () { setState({day: d}); }; })(n) : function () {}
    });
  }
  return out;
}

function renderVals() {
  var base = 130,
      exp = state.urgency === 'express' ? 60 : 0,
      del = state.delivery === 'courier' ? 19.5 : 0;
  var days = calendar();
  var picked = days.filter(function (d) { return d.label === String(state.day); })[0] || {};
  var times = ['09:00','09:40','10:20','11:00','11:40','14:00','14:40','15:20'];
  var taken = ['09:00','11:00'];

  var vals = {};
  SECTIONS.forEach(function (id, i) {
    var on = state.active === id;
    vals['n' + (i + 1)] = {
      bg: on ? '#ebe7dc' : 'transparent',
      bc: on ? '#7b2230' : 'transparent',
      fg: on ? '#14181f' : '#2a3038',
      fw: on ? '600' : '500',
      click: function () { jump(id); }
    };
  });

  vals.photoGuides = true;
  vals.showSwitcher = true;
  vals.days = days;
  vals.pickedDay = state.day;
  vals.pickedWeekday = picked.weekday || '';
  vals.slot = state.slot;
  vals.slots = times.map(function (t) {
    var open = taken.indexOf(t) === -1;
    var sel = open && t === state.slot;
    return {
      label: t,
      bg: sel ? '#1c2c4c' : open ? '#ffffff' : '#f0ede5',
      bc: sel ? '#1c2c4c' : open ? '#cfc9bb' : '#f0ede5',
      fg: sel ? '#ffffff' : open ? '#14181f' : '#86816f',
      click: open ? function () { setState({slot: t}); } : function () {}
    };
  });

  vals.isApply = state.screen === 'apply';
  vals.isDash = state.screen === 'dashboard';
  vals.isAppt = state.screen === 'appointment';
  vals.isDone = state.screen === 'confirmation';

  vals.goDash = function (e) { if (e && e.preventDefault) e.preventDefault(); go('dashboard'); };
  vals.goApply = function () { go('apply'); };
  vals.goAppt = function () { go('appointment'); };
  vals.goDone = function () { go('confirmation'); };
  vals.goSection5 = function () { go('apply'); setTimeout(function () { jump('s5'); }, 60); };

  vals.toggleDeclared = function (e) { setState({declared: !!e.target.checked}); };
  vals.setStandard = function () { setState({urgency: 'standard'}); };
  vals.setExpress  = function () { setState({urgency: 'express'}); };
  vals.setCollect  = function () { setState({delivery: 'collect'}); };
  vals.setCourier  = function () { setState({delivery: 'courier'}); };

  vals.photoReplace = function () { if (slots['pp-photo']) slots['pp-photo'].open(); };
  vals.photoRemove  = function () { if (slots['pp-photo']) slots['pp-photo'].clear(); };

  vals.fee = {
    base: money(base),
    exp: exp ? money(exp) : '—',
    del: del ? money(del) : 'Free',
    total: money(base + exp + del)
  };
  vals.speedLabel = state.urgency === 'express' ? 'Expedited — 8 working days' : 'Standard — 3 weeks';
  vals.deliveryLabel = state.delivery === 'courier' ? 'Tracked courier to home address' : 'Collect at passport office';
  return vals;
}

function render() {
  VALS = renderVals();
  for (var i = 0; i < ups.length; i++) ups[i](VALS);
}

var app = document.getElementById('app');
var tpl = document.getElementById('tpl').content;
for (var i = 0; i < tpl.childNodes.length; i++) {
  var built = compile(tpl.childNodes[i], ups, null);
  if (built) app.appendChild(built);
}
render();

window.addEventListener('scroll', spy, {passive: true});
setTimeout(spy, 80);
})();
</script>
</body>
