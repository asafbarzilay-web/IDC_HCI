<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shvil</title>

<!--
  Shvil: the third participant-facing study in this repo, built from a
  Claude Design handoff (dog-walker-matchmaking-app / Shvil.dc.html).

  The prototype is a real, fluid website (clamp()/vw sizing, a
  content column that grows with the viewport). That is exactly the
  property a study app cannot have: two participants on different
  screens would have their clicks measured against different-sized
  boxes, and the heatmaps would not be comparable. So this recreation
  fixes one frame size (1180x760) and turns every clamp()/vw rule into
  a constant tuned for that frame, the same trade photo.html made for
  a phone. Colours, type and layout are otherwise kept faithful to the
  handoff.

  Graph-shaped, like photo.html: a persistent header (Explore / Walks
  / Messages / Account) reaches every authed screen, so there is no
  "last step" and attemptExhausted stays false. Two funnels are
  embedded in the graph rather than being the whole app: onboarding
  (welcome -> signup/login -> dogsetup -> explore) and a booking flow
  (walker -> book -> checkout -> confirmed -> live -> recap -> rate).

  No overlay layer: unlike photo's photo-viewer, every screen here
  fully replaces the frame's content, so `overlay` stays null always.

  Instrumentation lives in study-core.js, shared with index.html and
  photo.html.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --w: 1180px;       /* frame width — the measured box, fixed for every participant */
    --h: 760px;        /* frame height */
    --header: 64px;
    --bg: #FFF6ED;
    --ink: #0B1D3A;
    --accent: #CE3A15;
    --accent-hover: #B02F0F;
    --muted: #6E6155;
    --label: #8A7B6C;
    --border: #F0E2D4;
    --border2: #EEDFCF;
    --field: #FFFCF8;
    --soft: #FFF3EA;
    --soft-border: #FFD9C0;
    --green-bg: #E3F3E8;
    --green: #1B5E3A;
    --blue-bg: #EDF3F9;
    --slate: #43566F;
    --gold: #E09400;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  /* `display: flex` on an element outranks the [hidden] attribute's own
     `display: none`, so a hidden flex element keeps its box and keeps
     taking space — the same trap noted in photo.html. */
  [hidden] { display: none !important; }

  html, body {
    margin: 0;
    height: 100%;
    background: #2A2118;
    font-family: 'Instrument Sans', system-ui, sans-serif;
    color: var(--ink);
  }

  .stage { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 24px 0; }

  /* Embedded in one of the dashboard's preview frames, scaled to fit
     rather than clipped — see photo.html for why. Participants never
     get this; their frame stays 1:1 so every target is physically the
     size the design intends. */
  .stage.fit { position: relative; display: block; padding: 0; height: 100vh; }
  .stage.fit > div { position: static; }
  .stage.fit .frame { position: absolute; transform-origin: top left; box-shadow: none; }

  /* The measured box. Study.configure() points at this. */
  .frame {
    position: relative;
    width: var(--w);
    height: var(--h);
    background: var(--bg);
    overflow: hidden;
    border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
  }

  a { color: var(--accent); text-decoration: none; }
  input, textarea, button, select { font-family: inherit; font-size: inherit; }
  ::placeholder { color: #A99A8B; }
  @keyframes ping { 0% { transform: scale(1); opacity: .5; } 70% { transform: scale(2.6); opacity: 0; } 100% { opacity: 0; } }

  /* --- header --------------------------------------------------------- */
  .header {
    flex: 0 0 var(--header); height: var(--header);
    display: flex; align-items: center; gap: 18px; padding: 0 24px;
    background: rgba(255,246,237,.94); border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: center; gap: 9px; cursor: pointer; }
  .brand .dot { width: 30px; height: 30px; border-radius: 50%; background: radial-gradient(circle at 50% 38%,#FFE9A8,#FFB020 42%,#F4623A 78%,#CE3A15); }
  .brand .name { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: -.02em; }
  .loc-chip { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: #fff; border: 1px solid var(--border2); font-size: 12.5px; font-weight: 600; color: var(--slate); }
  .loc-chip .b { width: 6px; height: 6px; border-radius: 50%; background: #1E6FA8; }
  .navrow { display: flex; gap: 4px; margin-left: auto; }
  .navlink { padding: 8px 14px; border-radius: 999px; border: none; cursor: pointer; font-size: 13.5px; font-weight: 600; background: transparent; color: var(--slate); }
  .navlink[aria-current="true"] { background: var(--ink); color: #fff; }
  .avatar-btn { width: 34px; height: 34px; border-radius: 50%; overflow: hidden; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(11,29,58,.18); cursor: pointer; flex: 0 0 auto; background: #1E6FA8; }
  .avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* --- body / scroll -------------------------------------------------- */
  .body { flex: 1 1 auto; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
  .col { max-width: 1080px; margin: 0 auto; padding: 26px 24px 60px; }
  .col-narrow { max-width: 760px; }
  .col-tight { max-width: 480px; }

  h1, h2, h3 { font-family: 'Outfit', sans-serif; letter-spacing: -.02em; margin: 0; }
  .card { background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 18px; }
  .muted { color: var(--muted); }
  .label { display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; color: var(--label); margin-bottom: 6px; }
  .field { width: 100%; padding: 12px 14px; border: 1.5px solid #EADCCB; border-radius: 12px; background: var(--field); font-size: 14.5px; color: var(--ink); }
  textarea.field { resize: vertical; line-height: 1.5; }

  .btn { border: none; border-radius: 999px; padding: 13px 20px; font-weight: 700; font-size: 14.5px; cursor: pointer; background: #fff; color: var(--ink); border: 1.5px solid var(--border2); }
  .btn.primary { background: var(--accent); color: #fff; border: none; }
  .btn.primary:hover { background: var(--accent-hover); }
  .btn.block { width: 100%; }
  .btn.ghost { background: none; border: none; color: var(--muted); font-weight: 600; text-decoration: underline; }
  .back-link { background: none; border: none; color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; padding: 5px 0; margin-bottom: 10px; }

  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--border2); background: #fff; color: var(--slate); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .box-opt { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 8px; border-radius: 12px; cursor: pointer; border: 1.5px solid var(--border2); background: #fff; }
  .box-opt.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .box-opt.off { background: #F7EFE5; color: #BDAE9E; border-color: var(--border); cursor: not-allowed; }

  .badge-green { font-size: 11px; font-weight: 700; color: var(--green); background: var(--green-bg); padding: 4px 9px; border-radius: 999px; }
  .badge-blue { font-size: 11px; font-weight: 700; color: var(--slate); background: var(--blue-bg); padding: 4px 9px; border-radius: 999px; }
  .badge-gold { font-size: 11px; font-weight: 800; color: var(--ink); background: #FFB020; padding: 4px 9px; border-radius: 999px; }
  .star-ink { color: var(--gold); }

  .avatar { border-radius: 50%; overflow: hidden; background: #1E6FA8; flex: 0 0 auto; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* --- welcome ---------------------------------------------------------- */
  .welcome { display: flex; height: 100%; }
  .welcome-art { flex: 0 0 46%; position: relative; overflow: hidden; background: linear-gradient(172deg,#2E2559 0%,#5C4288 24%,#A9558C 46%,#E2603F 66%,#FFB43A 100%); display: flex; flex-direction: column; justify-content: flex-end; padding: 36px; }
  .welcome-art .sun { position: absolute; left: 50%; top: 24%; transform: translate(-50%,-50%); width: 170px; height: 170px; border-radius: 50%; background: radial-gradient(circle at 50% 40%,#FFF6D6,#FFD166 40%,#FFA82E 72%,#F4623A); box-shadow: 0 0 100px 30px rgba(255,176,32,.45); }
  .welcome-art .hz { position: absolute; left: 0; right: 0; bottom: 0; height: 42%; background: linear-gradient(180deg,rgba(30,111,168,.55),#123B6B 40%,#0B1D3A); }
  .welcome-art .kicker { position: relative; z-index: 2; font-size: 11px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: #FFD9B8; }
  .welcome-art h1 { position: relative; z-index: 2; color: #fff; font-size: 38px; line-height: 1.05; font-weight: 800; margin-top: 12px; }
  .welcome-art p { position: relative; z-index: 2; color: #FFE7D3; font-size: 15px; max-width: 34ch; margin: 14px 0 0; line-height: 1.5; }
  .welcome-panel { flex: 1; display: flex; align-items: center; justify-content: center; padding: 30px; }
  .welcome-panel .inner { width: 100%; max-width: 380px; }
  .faces { display: flex; align-items: center; margin-bottom: 18px; }
  .faces .avatar { width: 34px; height: 34px; border: 2.5px solid var(--bg); margin-left: -10px; }
  .faces .avatar:first-child { margin-left: 0; }
  .faces .n { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 12px; }
  .proof { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 20px; }
  .proof .item { display: flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--slate); }
  .proof .item .ok { width: 16px; height: 16px; border-radius: 50%; background: #FFEFD6; color: var(--accent); display: grid; place-items: center; font-size: 10px; font-weight: 800; }

  /* --- auth / dogsetup ---------------------------------------------------- */
  .center-page { display: flex; align-items: flex-start; justify-content: center; padding: 34px 24px; }
  .auth-card { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--border); border-radius: 22px; padding: 28px; box-shadow: 0 20px 50px -36px rgba(11,29,58,.5); }
  .auth-card .dot { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 50% 38%,#FFE9A8,#FFB020 42%,#F4623A 78%,#CE3A15); margin-bottom: 14px; }
  .divider { display: flex; align-items: center; gap: 10px; margin: 16px 0; }
  .divider .line { flex: 1; height: 1px; background: var(--border); }
  .divider span { font-size: 11px; color: #A99A8B; font-weight: 600; }
  .field + .field { margin-top: 12px; }

  .setup-steps { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .setup-steps .bar { height: 4px; flex: 1; border-radius: 2px; background: var(--border2); }
  .setup-steps .bar.on { background: var(--accent); }
  .setup-steps .n { font-size: 11px; font-weight: 700; color: var(--label); letter-spacing: .08em; }
  .dogsetup-card { width: 100%; max-width: 560px; background: #fff; border: 1px solid var(--border); border-radius: 22px; padding: 26px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* --- explore ------------------------------------------------------------ */
  .explore-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 14px; margin-bottom: 18px; }
  .kicker { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; color: var(--accent); }
  .viewtabs { display: flex; gap: 4px; background: #F6E7D8; padding: 4px; border-radius: 999px; }
  .viewtabs button { padding: 8px 18px; border-radius: 999px; border: none; cursor: pointer; font-size: 12.5px; font-weight: 700; background: transparent; color: #8A7B6C; }
  .viewtabs button[aria-current="true"] { background: #fff; color: var(--ink); }
  .search-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  .search-box { flex: 1 1 240px; display: flex; align-items: center; gap: 9px; background: #fff; border: 1.5px solid var(--border2); border-radius: 999px; padding: 10px 15px; }
  .search-box input { flex: 1; border: none; background: transparent; font-size: 13.5px; color: var(--ink); outline: none; }
  .result-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; font-size: 13px; }
  .sorts { display: flex; gap: 5px; align-items: center; }
  .sorts button { padding: 6px 11px; border-radius: 999px; border: none; cursor: pointer; font-size: 12px; font-weight: 600; background: #F6E7D8; color: var(--muted); }
  .sorts button[aria-current="true"] { background: var(--ink); color: #fff; }

  .w-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .w-card { background: #fff; border: 1px solid var(--border); border-radius: 18px; overflow: hidden; cursor: pointer; display: flex; flex-direction: column; }
  .w-card .cover { position: relative; height: 118px; background: linear-gradient(160deg,#2E2559,#6B4E8C 45%,#E2603F); }
  .w-card .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .92; }
  .w-card .cover .shade { position: absolute; inset: 0; background: linear-gradient(180deg,rgba(11,29,58,0) 40%,rgba(11,29,58,.72)); }
  .w-card .instant { position: absolute; top: 10px; left: 10px; }
  .w-card .rate-badge { position: absolute; top: 10px; right: 10px; background: rgba(255,255,255,.95); color: var(--ink); font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 999px; }
  .w-card .who { position: absolute; left: 12px; bottom: 10px; right: 12px; display: flex; align-items: flex-end; gap: 9px; }
  .w-card .who .avatar { width: 44px; height: 44px; border: 2px solid #fff; }
  .w-card .who .name { font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 15.5px; color: #fff; }
  .w-card .who .sub { font-size: 11.5px; color: #FFE0C6; font-weight: 500; }
  .w-card .body { padding: 12px 13px 13px; display: flex; flex-direction: column; flex: 1; }
  .w-card .badges { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
  .w-card .short { font-size: 12.5px; line-height: 1.45; color: var(--slate); margin: 0 0 10px; flex: 1; }
  .w-card .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 11px; }
  .w-card .tags span { font-size: 11px; font-weight: 600; color: var(--muted); border: 1px solid var(--border2); padding: 3px 8px; border-radius: 7px; }
  .w-card .foot { display: flex; align-items: center; justify-content: space-between; padding-top: 10px; border-top: 1px solid #F4E8DB; }
  .w-card .price { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 18px; }
  .w-card .price small { font-size: 11px; color: var(--label); font-weight: 600; }
  .w-card .foot .btns { display: flex; gap: 6px; }
  .w-card .foot .btn { padding: 8px 12px; font-size: 12.5px; }

  .explore-map { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
  .map-box { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--border2); background: #F7EEE0; height: 420px; }
  .map-shore { position: absolute; left: 0; top: 0; bottom: 0; width: 26%; background: linear-gradient(100deg,#0B1D3A,#1E6FA8 55%,#3FA0D8); }
  .map-pin { position: absolute; transform: translate(-50%,-100%); cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 12px; padding: 6px 10px; border-radius: 999px; white-space: nowrap; box-shadow: 0 6px 14px -6px rgba(11,29,58,.7); background: #fff; color: var(--ink); border: 2px solid #fff; }
  .map-pin.on { background: var(--accent); color: #fff; z-index: 5; }
  .map-hood { position: absolute; font-size: 10px; font-weight: 800; letter-spacing: .12em; color: #A2917E; pointer-events: none; white-space: nowrap; }
  .map-list { display: flex; flex-direction: column; gap: 10px; max-height: 420px; overflow-y: auto; padding-right: 2px; }
  .map-mini { display: flex; gap: 10px; align-items: center; background: #fff; border: 1.5px solid var(--border); border-radius: 16px; padding: 10px; cursor: pointer; }
  .map-mini.on { background: var(--soft); border-color: var(--accent); }
  .map-mini .avatar { width: 46px; height: 46px; border-radius: 14px; }
  .map-mini .name { font-weight: 700; font-size: 14.5px; font-family: 'Outfit', sans-serif; }
  .map-mini .meta { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .map-mini .price { margin-left: auto; text-align: right; }

  /* --- walker profile ------------------------------------------------- */
  .w-hero { position: relative; border-radius: 20px; overflow: hidden; height: 170px; background: linear-gradient(150deg,#2E2559,#6B4E8C 40%,#E2603F 80%,#FFB43A); }
  .w-hero img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .55; }
  .w-headrow { display: flex; gap: 16px; align-items: flex-end; margin: -44px 0 20px; position: relative; z-index: 2; padding: 0 4px; }
  .w-headrow .avatar { width: 92px; height: 92px; border-radius: 22px; border: 4px solid var(--bg); box-shadow: 0 12px 26px -16px rgba(11,29,58,.8); }
  .w-profile-grid { display: grid; grid-template-columns: 1fr 260px; gap: 20px; align-items: start; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-bottom: 16px; }
  .stat-grid .cell { background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 12px; }
  .stat-grid .v { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 19px; }
  .stat-grid .k { font-size: 11px; color: var(--label); font-weight: 600; margin-top: 2px; }
  .week-strip { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 6px; }
  .week-strip .d { text-align: center; padding: 8px 4px; border-radius: 10px; font-size: 10px; }
  .review-row { padding-bottom: 14px; border-bottom: 1px solid #F4E8DB; margin-bottom: 14px; }
  .review-row:last-child { border: none; margin: 0; padding: 0; }
  .sidebar-sticky { position: sticky; top: 0; background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 18px; }
  .slot-row { display: flex; justify-content: space-between; align-items: center; background: #FFFAF4; border: 1.5px solid var(--border2); border-radius: 13px; padding: 11px 13px; cursor: pointer; width: 100%; text-align: left; }

  /* --- booking / checkout ---------------------------------------------- */
  .book-grid { display: grid; grid-template-columns: 1fr 300px; gap: 18px; align-items: start; }
  .day-grid { display: grid; grid-template-columns: repeat(7, minmax(0,1fr)); gap: 7px; }
  .time-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 7px; }
  .dur-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .dog-pick-row { display: flex; gap: 9px; flex-wrap: wrap; }
  .dog-pick { display: flex; gap: 9px; align-items: center; padding: 9px 14px 9px 9px; border-radius: 14px; cursor: pointer; border: 1.5px solid var(--border2); background: #fff; }
  .dog-pick.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .dog-pick .avatar { width: 38px; height: 38px; }
  .pickup-row { display: flex; align-items: center; gap: 11px; background: #FFFAF4; border: 1.5px solid var(--border2); border-radius: 13px; padding: 11px 13px; }
  .pickup-row .icon { width: 30px; height: 30px; border-radius: 9px; background: var(--blue-bg); display: grid; place-items: center; color: #1E6FA8; }
  .summary-row { display: flex; justify-content: space-between; font-size: 13.5px; padding: 7px 0; }
  .summary-row.total { font-size: 16px; font-weight: 700; border-top: 1px solid #F4E8DB; padding-top: 9px; margin-top: 4px; }
  .pay-row { display: flex; gap: 12px; align-items: center; width: 100%; padding: 13px; border-radius: 14px; cursor: pointer; border: 1.5px solid var(--border2); background: #fff; text-align: left; }
  .pay-row.on { background: var(--soft); border-color: var(--accent); }
  .pay-row .radio { width: 18px; height: 18px; border-radius: 50%; flex: 0 0 auto; border: 2px solid #D8C6B2; }
  .pay-row.on .radio { border: 5px solid var(--accent); }

  /* --- confirmed / live / recap / rate ---------------------------------- */
  .confirm-box { text-align: center; max-width: 420px; margin: 40px auto; }
  .confirm-check { width: 78px; height: 78px; margin: 0 auto 16px; border-radius: 50%; background: radial-gradient(circle at 50% 38%,#FFF6D6,#FFD166 40%,#FFA82E 72%,#F4623A); display: grid; place-items: center; color: #fff; font-size: 32px; }
  .live-badge { display: inline-flex; align-items: center; gap: 8px; background: var(--green-bg); color: var(--green); font-size: 11px; font-weight: 800; letter-spacing: .07em; padding: 6px 12px; border-radius: 999px; }
  .live-dot { position: relative; width: 8px; height: 8px; }
  .live-dot span { position: absolute; inset: 0; border-radius: 50%; background: #1B9E52; }
  .live-dot span.ping { animation: ping 1.8s ease-out infinite; }
  .live-map { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--border2); height: 340px; background: #F7EEE0; }
  .dog-marker { position: absolute; transform: translate(-50%,-50%); }
  .dog-marker .ring { position: absolute; inset: -12px; border-radius: 50%; background: rgba(206,58,21,.3); animation: ping 2s ease-out infinite; }
  .dog-marker .avatar { width: 38px; height: 38px; border: 3px solid #fff; box-shadow: 0 6px 16px -4px rgba(11,29,58,.6); }
  .live-stats { position: absolute; left: 12px; bottom: 12px; right: 12px; background: rgba(255,255,255,.94); border-radius: 14px; padding: 11px 14px; display: flex; justify-content: space-between; }
  .live-stats .v { font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 18px; }
  .live-stats .k { font-size: 11px; color: var(--label); font-weight: 600; }
  .progress-track { height: 8px; border-radius: 999px; background: #F4E8DB; overflow: hidden; }

  .timeline-item .tline { width: 2px; flex: 1; background: #F0E2D4; min-height: 22px; }
  .timeline-item .tline.on { background: var(--accent); }

  .recap-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .recap-stats .cell { background: #fff; border: 1px solid var(--border); border-radius: 16px; padding: 14px; text-align: center; }

  /* --- chat ------------------------------------------------------------- */
  .chat-grid { display: grid; grid-template-columns: 280px 1fr; gap: 16px; align-items: start; height: 100%; }
  .thread-row { display: flex; gap: 10px; align-items: center; padding: 10px; border-radius: 13px; cursor: pointer; }

  .thread-row .name { font-weight: 700; font-size: 14px; }
  .thread-row .last { font-size: 12.5px; color: var(--muted); margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chat-panel { background: #fff; border: 1px solid var(--border); border-radius: 18px; display: flex; flex-direction: column; height: 480px; }
  .chat-head { display: flex; gap: 10px; align-items: center; padding: 13px 16px; border-bottom: 1px solid #F4E8DB; }

  .chat-input-row input { flex: 1; padding: 11px 14px; border: 1.5px solid #EADCCB; border-radius: 999px; background: var(--field); font-size: 13.5px; }

  /* --- bookings / account ---------------------------------------------- */
  .booking-row { background: #fff; border: 1px solid var(--border); border-radius: 18px; padding: 15px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }

  .account-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }

  .dog-row { display: flex; gap: 11px; align-items: center; padding: 10px; border: 1px solid var(--border); border-radius: 14px; margin-bottom: 8px; }
  .card-row { display: flex; gap: 10px; align-items: center; padding: 11px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; }

  /* --- task prompt -------------------------------------------------------- */

  function filteredWalkers() {

    let list = WALKERS.filter(w => {
      if (q && !(w.name + ' ' + w.hood + ' ' + w.tags.join(' ')).toLowerCase().includes(q)) return false;
      if (filters.instant && !w.instant) return false;
      if (filters.under80 && w.rate >= 80) return false;
      if (filters.verified && !(w.verified && w.bg)) return false;
      if (filters.large && !w.tags.includes('Large dogs')) return false;
      return true;
    });
    if (sortKey === 'price') list = list.slice().sort((a, b) => a.rate - b.rate);
    if (sortKey === 'near') list = list.slice().sort((a, b) => parseFloat(a.dist) - parseFloat(b.dist));
    if (sortKey === 'best') list = list.slice().sort((a, b) => (b.rating * 100 + b.revs / 50) - (a.rating * 100 + a.revs / 50));
    return list.map(decorate);
  }

  function renderPrompt() {
    const wrap = document.getElementById('prompt');
    const goal = document.getElementById('task-goal');
    const t = Study.currentTask();
    const active = t && t.kind === 'app_route';
    wrap.hidden = !Study.inBattery();
    goal.innerHTML = active ? `
      <div class="step">Your task</div>
      <div class="goal">${Study.escapeHtml(t.goal_text)}</div>

  // =====================================================================
  // Interaction
  // =====================================================================
  document.addEventListener('click', (e) => {
    const t = e.target instanceof Element ? e.target : null;
    if (!t) return;

    const authSubmit = t.closest('[data-auth-submit]');
    if (authSubmit) { go(authSubmit.dataset.authSubmit === 'signup' ? 'dogsetup' : 'explore', 'auth:' + authSubmit.dataset.authSubmit); return; }

    const goto = t.closest('[data-goto]');
    if (goto) { go(goto.dataset.goto, 'nav:' + goto.dataset.goto); return; }

    const back = t.closest('[data-back]');
    if (back) { go(back.dataset.back, 'back'); return; }

    if (t.closest('#finish-setup')) { go('explore', 'finish_setup'); return; }
    if (t.closest('#change-photo')) { choose('change_photo', () => {}); return; }

    const size = t.closest('[data-size]');
    if (size) { choose('size:' + size.dataset.size, () => { dogSize = size.dataset.size; }); return; }

    const trait = t.closest('[data-trait]');
    if (trait) { const tr = trait.dataset.trait; choose('trait:' + tr, () => {
      dogTraits = dogTraits.includes(tr) ? dogTraits.filter(x => x !== tr) : dogTraits.concat([tr]);
    }); return; }

    const viewBtn = t.closest('[data-view]');
    if (viewBtn) { const v = viewBtn.dataset.view; choose('view:' + v, () => { view = v; }); return; }

    const filter = t.closest('[data-filter]');
    if (filter) { const k = filter.dataset.filter; choose('filter:' + k, () => { filters = { ...filters, [k]: !filters[k] }; }); return; }

    const sort = t.closest('[data-sort]');
    if (sort) { choose('sort:' + sort.dataset.sort, () => { sortKey = sort.dataset.sort; }); return; }

    const open = t.closest('[data-open]');
    if (open) { walkerId = Number(open.dataset.open); go('walker', 'open:' + walkerId); return; }

    const book = t.closest('[data-book]');
    if (book) { walkerId = Number(book.dataset.book); go('book', 'book:' + walkerId); return; }

    const quickslot = t.closest('[data-quickslot]');
    if (quickslot) {
      const i = Number(quickslot.dataset.quickslot);
      const presets = [[0, '16:00'], [1, '08:30'], [2, '10:00']];
      const [d, tm] = presets[i];
      bDate = d; bTime = tm;
      go('book', 'quickslot:' + i);
      return;
    }

    const day = t.closest('[data-day]');
    if (day) { choose('day:' + day.dataset.day, () => { bDate = Number(day.dataset.day); }); return; }

    const time = t.closest('[data-time]');
    if (time) { choose('time:' + time.dataset.time, () => { bTime = time.dataset.time; }); return; }

    const dur = t.closest('[data-dur]');
    if (dur) { choose('dur:' + dur.dataset.dur, () => { bDur = Number(dur.dataset.dur); }); return; }

    const dog = t.closest('[data-dog]');
    if (dog) { choose('dog:' + dog.dataset.dog, () => { bDogIdx = Number(dog.dataset.dog); }); return; }

    if (t.closest('#book-next')) { go('checkout', 'continue_to_payment'); return; }

    const pay = t.closest('[data-pay]');
    if (pay) { choose('pay:' + pay.dataset.pay, () => { payMethod = pay.dataset.pay; }); return; }

    if (t.closest('#promo-apply')) {
      const v = promo.trim();
      choose('promo:' + (v ? 'applied' : 'empty'), () => { promoOk = v.toUpperCase() === 'FIRSTWALK' || v !== ''; });
      return;
    }

    if (t.closest('#confirm-pay')) { go('confirmed', 'confirm_pay'); return; }
    if (t.closest('#rebook-btn')) { go('book', 'rebook'); return; }

    const star = t.closest('[data-star]');
    if (star) { choose('star:' + star.dataset.star, () => { rating = Number(star.dataset.star); }); return; }

    const tag = t.closest('[data-tag]');
    if (tag) { const tg = tag.dataset.tag; choose('tag:' + tg, () => {
      tags = tags.includes(tg) ? tags.filter(x => x !== tg) : tags.concat([tg]);
    }); return; }

    const tipBtn = t.closest('[data-tip]');
    if (tipBtn) { choose('tip:' + tipBtn.dataset.tip, () => { tip = Number(tipBtn.dataset.tip); }); return; }

    if (t.closest('#submit-rating')) { go('bookings', 'submit_rating'); return; }

    const thread = t.closest('[data-thread]');
    if (thread) { choose('thread:' + thread.dataset.thread, () => { chatWalkerId = Number(thread.dataset.thread); }); return; }

    if (t.closest('#chat-send')) { sendChat(); return; }
    if (t.closest('#logout-btn')) { go('welcome', 'logout'); return; }
    if (t.closest('[data-edit-dog]')) { choose('edit_dog', () => {}); return; }
  });

  function sendChat() {
    const input = document.getElementById('chat-input');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    if (record('msg:' + text)) return;
    extraMsgs = extraMsgs.concat([{ me: 1, text, at: '14:12' }]);
    render();
    const box = document.getElementById('chat-input');
    if (box) box.focus();
  }

  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    if (e.target.closest && e.target.closest('#chat-input')) { sendChat(); return; }
  });

  // Text fields update local state on input, but do not themselves write a
  // selection row — only submitting (Enter, a button) is a choice, the
  // same rule photo.html applies to its search box.
  document.addEventListener('input', (e) => {
    const t = e.target;
    if (!(t instanceof Element)) return;
    if (t.id === 'dog-name-input') dogName = t.value;
    else if (t.id === 'dog-breed-input') dogBreed = t.value;
    else if (t.id === 'dog-notes-input') dogNotes = t.value;
    else if (t.id === 'q-input') { query = t.value; renderBody(); }
    else if (t.id === 'b-notes') bNotes = t.value;
    else if (t.id === 'promo-input') promo = t.value;
    else if (t.id === 'review-input') reviewText = t.value;
  });

  // =====================================================================
  // Preview / author / question-preview fit, same approach as photo.html.
  // =====================================================================
  if (PREVIEW) screen = PREVIEW;

  if (Study.PREVIEW_MODE || Study.AUTHOR_MODE || Study.QUESTION_PREVIEW) {
    const stage = document.querySelector('.stage');
    stage.classList.add('fit');
    const fit = () => {
      const frame = document.getElementById('frame');
      const vw = window.innerWidth, vh = window.innerHeight;
      const s = Math.min(vw / 1180, vh / 760, 1);
      frame.style.transform = `scale(${s})`;
      frame.style.left = `${Math.round((vw - 1180 * s) / 2)}px`;
      frame.style.top = `${Math.round((vh - 760 * s) / 2)}px`;
    };
    fit();
    window.addEventListener('resize', fit);
    if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  }

  render();

  if (!TRACKING_OFF) {
    (async () => {
      const { offer } = await Study.startStudy();
      if (offer) {
        const wrap = document.getElementById('prompt');
        wrap.hidden = false;
        document.getElementById('task-goal').innerHTML = '<button class="give-up" id="start-tasks">Start the tasks →</button>';
        document.getElementById('start-tasks').addEventListener('click', () => { Study.beginTasks(); });
      }
    })();
  }
</script>
</body>
</html>
