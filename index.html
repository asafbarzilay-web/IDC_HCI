<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDC HCI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  // Isolated client: never loads or stores an auth session, so inserts
  // are always made as the anonymous role. Without this, logging into
  // the dashboard on this same origin would attach the auth session to
  // the app's inserts too — and the RLS insert policy (anon only) would
  // silently reject every event from that browser.
  //
  // Analytics must never be able to break the app itself: if the library
  // didn't load (offline, blocked CDN, opened as a file:// page), we fall
  // back to null and the selector still works, just untracked.
  var supabaseClient = null;
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false }
    });
  } catch (err) {
    console.warn('Analytics disabled — could not initialise Supabase:', err);
  }
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #F0EEE6;
    font-family: ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif;
    color: #29261F;
    -webkit-font-smoothing: antialiased;
  }

  @keyframes flowIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    60% { transform: scale(1.06); }
    100% { transform: scale(1); opacity: 1; }
  }

  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .wrap { width: 100%; max-width: 560px; }

  .progress-rail {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 40px;
  }

  .progress-dot {
    height: 6px;
    border-radius: 3px;
    transition: all 0.3s ease;
    background: #D8D3C6;
    width: 12px;
  }

  .progress-dot.active {
    width: 28px;
    background: #C15F3C;
  }

  .progress-spacer { flex: 1; }

  .progress-label {
    font-size: 13px;
    color: #8A8578;
    letter-spacing: 0.02em;
  }

  .step { animation: flowIn 0.4s ease both; }

  .eyebrow {
    font-size: 13px;
    font-weight: 500;
    color: #C15F3C;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-family: Newsreader, Georgia, serif;
    font-weight: 400;
    font-size: 40px;
    line-height: 1.1;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .step-copy {
    font-size: 16px;
    color: #6B665A;
    margin: 0 0 32px;
    line-height: 1.5;
  }

  .option-grid {
    display: grid;
    gap: 14px;
  }

  .option-grid.numbers { grid-template-columns: repeat(3, 1fr); }
  .option-grid.letters { grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .option-grid.shapes { grid-template-columns: repeat(3, 1fr); }

  .option-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    aspect-ratio: 1;
    background: #FAF9F5;
    border: 1px solid #E0DBCE;
    border-radius: 16px;
    cursor: pointer;
    font-family: inherit;
    color: #29261F;
    transition: all 0.18s ease;
    padding: 0;
  }

  .option-card:hover:not(.selected) {
    border-color: #C9A491;
    background: #FCFBF7;
    transform: translateY(-2px);
  }

  .option-card.selected {
    background: #F6E9E1;
    border-color: #C15F3C;
    box-shadow: 0 0 0 3px rgba(193, 95, 60, 0.15);
  }

  .option-glyph-text {
    font-family: Newsreader, Georgia, serif;
    line-height: 1;
  }

  .option-grid.numbers .option-glyph-text { font-size: 44px; }
  .option-grid.letters .option-glyph-text { font-size: 38px; }

  .shape-glyph.circle { width: 44px; height: 44px; border-radius: 50%; background: #4A463C; }
  .shape-glyph.square { width: 42px; height: 42px; border-radius: 6px; background: #4A463C; }
  .shape-glyph.triangle {
    width: 0; height: 0;
    border-left: 24px solid transparent;
    border-right: 24px solid transparent;
    border-bottom: 42px solid #4A463C;
  }

  .option-card.selected .shape-glyph.circle,
  .option-card.selected .shape-glyph.square { background: #C15F3C; }
  .option-card.selected .shape-glyph.triangle { border-bottom-color: #C15F3C; }

  .shape-label { font-size: 14px; color: #6B665A; }

  .success { text-align: center; animation: flowIn 0.5s ease both; }

  .success-badge {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: #C15F3C;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 28px;
    animation: pop 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }

  .success h1 { font-size: 44px; margin: 0 0 12px; }

  .success-copy {
    font-size: 17px;
    color: #6B665A;
    margin: 0 0 28px;
    line-height: 1.5;
  }

  .success-copy strong { color: #29261F; font-weight: 500; }

  .restart-btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    color: #29261F;
    background: transparent;
    border: 1px solid #D8D3C6;
    border-radius: 10px;
    padding: 12px 24px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .restart-btn:hover { background: #E7E3D8; border-color: #C9C3B4; }

  .back-btn {
    margin-top: 36px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: 14px;
    color: #8A8578;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    transition: color 0.15s;
  }

  .back-btn:hover { color: #29261F; }
</style>
</head>
<body>

<div class="page">
  <div class="wrap">
    <div class="progress-rail" id="progress-rail">
      <div class="progress-dot" data-dot="0"></div>
      <div class="progress-dot" data-dot="1"></div>
      <div class="progress-dot" data-dot="2"></div>
      <div class="progress-spacer"></div>
      <div class="progress-label" id="progress-label"></div>
    </div>

    <div id="step-content"></div>

    <button class="back-btn" id="back-btn" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back
    </button>
  </div>
</div>

<script>
  const STEPS = [
    { key: 'number', eyebrow: 'Step one', title: 'Pick a number', copy: 'Choose one of the three to continue.', options: ['1', '2', '3'], grid: 'numbers' },
    { key: 'letter', eyebrow: 'Step two', title: 'Pick a letter', copy: 'Four to choose from — take your pick.', options: ['A', 'B', 'C', 'D'], grid: 'letters' },
    { key: 'shape', eyebrow: 'Step three', title: 'Pick a shape', copy: "One more and you're done.", options: [
      { id: 'circle', label: 'Circle' },
      { id: 'triangle', label: 'Triangle' },
      { id: 'square', label: 'Square' }
    ], grid: 'shapes' }
  ];

  // Preview mode: renders a single step statically (no tracking, no
  // interaction) so the dashboard can show a real screen behind its
  // heatmap dots. Activated via ?previewStep=number|letter|shape|success
  const PREVIEW_STEP_INDEX = { number: 0, letter: 1, shape: 2, success: 3 };
  const previewStepParam = new URLSearchParams(location.search).get('previewStep');
  const PREVIEW_MODE = previewStepParam in PREVIEW_STEP_INDEX;

  // Author mode: the real app, fully interactive, but recording nothing.
  // The dashboard embeds it so a task can be defined by demonstration —
  // click the route you want and each choice is reported to the parent.
  // Demonstrating is the only way a task can name a step or option that
  // actually exists; a hand-written task drifts the moment the flow changes.
  const AUTHOR_MODE = new URLSearchParams(location.search).get('authorMode') === '1';

  // Both modes are observation, not participation — neither may write.
  const TRACKING_OFF = PREVIEW_MODE || AUTHOR_MODE;

  function reportToAuthor(type, payload) {
    if (!AUTHOR_MODE || window.parent === window) return;
    // Same-origin only: the dashboard serves this frame, so there is no
    // reason to broadcast the study's task design more widely.
    window.parent.postMessage({ source: 'idc-hci-author', type, ...payload }, window.location.origin);
  }

  const state = { step: 0, number: null, letter: null, shape: null };
  let sessionId = newId();
  let stepEnteredAt = Date.now();
  let sessionReady = null;

  // Click ordinal per step, counted in the browser at click time so it
  // reflects the true order the participant clicked — not the order the
  // async inserts happened to reach the database. Counts persist across
  // Back/forward within a run and reset only when a new run starts.
  const newClickCounts = () => ({ number: 0, letter: 0, shape: 0, success: 0 });
  let clickSeq = newClickCounts();

  if (PREVIEW_MODE) {
    state.step = PREVIEW_STEP_INDEX[previewStepParam];
    if (state.step === 3) {
      state.number = '2';
      state.letter = 'B';
      state.shape = 'square';
    }
  }

  function newId() {
    // crypto.randomUUID needs a secure context; fall back where it isn't.
    try { return crypto.randomUUID(); }
    catch {
      return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
        const r = Math.random() * 16 | 0;
        return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
      });
    }
  }

  function getOrCreateUserId() {
    // localStorage can throw outright (private mode, blocked storage).
    // Losing persistence is fine; crashing the app is not.
    const key = 'idc_hci_user_id';
    try {
      let id = localStorage.getItem(key);
      if (!id) {
        id = newId();
        localStorage.setItem(key, id);
      }
      return id;
    } catch {
      return newId();
    }
  }

  function detectPlatform() {
    const ua = navigator.userAgent || '';
    const isTouchMac = /Mac/i.test(navigator.platform || '') && navigator.maxTouchPoints > 1;
    const isMobile = /Android|iPhone|iPad|iPod|Mobile|Windows Phone/i.test(ua) || isTouchMac;
    return isMobile ? 'mobile' : 'desktop';
  }

  const userId = getOrCreateUserId();
  const platform = detectPlatform();

  function currentStepLabel() {
    return state.step < 3 ? STEPS[state.step].key : 'success';
  }

  // Selections and clicks reference a session row, so that row has to
  // exist first. startSession() keeps the in-flight insert as a promise
  // and every later write waits on it — no ordering races, no orphans.
  function startSession(isRestart) {
    if (TRACKING_OFF || !supabaseClient) return Promise.resolve();
    return supabaseClient.from('sessions')
      .insert({ session_id: sessionId, user_id: userId, platform, is_restart: isRestart })
      .then(({ error }) => { if (error) console.error('startSession failed', error); })
      .catch(err => console.error('startSession failed', err));
  }

  // Capture the ids at call time: a restart swaps both sessionId and
  // sessionReady, and a write already in flight must keep its own pair.
  async function write(table, row) {
    if (TRACKING_OFF || !supabaseClient) return;
    const sid = sessionId, ready = sessionReady;
    try {
      await ready;
      const { error } = await supabaseClient.from(table).insert({ session_id: sid, ...row });
      if (error) console.error(`insert into ${table} failed`, error);
    } catch (err) {
      console.error(`insert into ${table} failed`, err);
    }
  }

  function select(key, value) {
    const duration_ms = Date.now() - stepEnteredAt;
    state[key] = value;
    state.step += 1;
    // A run is complete when every step has an answer. A participant may
    // answer the same step more than once (Back, then change their mind);
    // the latest answer wins and the revisit is what marks the run indirect.
    write('selections', { step: key, value, duration_ms });
    reportToAuthor('choice', { step: key, value });
    render();
  }

  function back() {
    state.step = Math.max(0, state.step - 1);
    render();
  }

  function reset() {
    // Start over begins a genuinely new attempt: new session row, flagged
    // as a restart so the dashboard can count them.
    sessionId = newId();
    sessionReady = startSession(true);
    clickSeq = newClickCounts();
    state.step = 0;
    state.number = null;
    state.letter = null;
    state.shape = null;
    reportToAuthor('reset', {});
    render();
  }

  document.addEventListener('click', (e) => {
    // Capture phase: runs before any button's own click handler mutates
    // state, so the logged step always reflects where the click landed.
    //
    // Anchor to the content column (.wrap), not the viewport. The column
    // is a fixed-max-width block whose layout is identical everywhere,
    // while the surrounding margins vary hugely with window size — so
    // column-relative coordinates are the only ones that mean the same
    // thing on a phone, a laptop, and the dashboard's small preview.
    //
    // Values intentionally fall outside 0-1 for clicks in the margins
    // (negative to the left/above, >1 to the right/below). The dashboard
    // maps them onto the preview's own column, so they stay in the right
    // place instead of being clamped to an edge.
    const rect = document.querySelector('.wrap').getBoundingClientRect();
    // A zero-sized column (hidden tab, not yet laid out) would divide by
    // zero and store Infinity/NaN. Nothing meaningful to record — skip.
    if (!rect.width || !rect.height) return;
    const step = currentStepLabel();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;

    // What the click actually landed on. Recorded here, where the answer
    // is certain, rather than derived later from click counts — Back and
    // Start over do something useful without being selections, so any
    // count-based guess would misreport them as mis-clicks.
    // Guard the target: closest() only exists on Elements, and a click can
    // report a non-Element target. Throwing here would drop the click
    // entirely — losing exactly the mis-click we're trying to measure.
    const t = e.target instanceof Element ? e.target : null;
    const hit = !t                          ? 'none'
              : t.closest('.option-card')   ? 'option'
              : t.closest('#back-btn')      ? 'back'
              : t.closest('#restart-btn')   ? 'restart'
              : 'none';

    clickSeq[step] += 1;
    write('clicks', { step, x, y, seq: clickSeq[step], hit });
  }, true);

  function render() {
    stepEnteredAt = Date.now();
    document.querySelectorAll('.progress-dot').forEach(dot => {
      const i = Number(dot.dataset.dot);
      dot.classList.toggle('active', i <= state.step);
    });
    document.getElementById('progress-label').textContent = state.step < 3 ? `Step ${state.step + 1} of 3` : 'Complete';

    const content = document.getElementById('step-content');
    const backBtn = document.getElementById('back-btn');

    if (state.step < 3) {
      const s = STEPS[state.step];
      const optionsHtml = s.options.map(opt => {
        if (s.grid === 'shapes') {
          const selected = state.shape === opt.id;
          return `
            <button class="option-card${selected ? ' selected' : ''}" data-value="${opt.id}">
              <span class="shape-glyph ${opt.id}"></span>
              <span class="shape-label">${opt.label}</span>
            </button>`;
        }
        const selected = state[s.key] === opt;
        return `
          <button class="option-card${selected ? ' selected' : ''}" data-value="${opt}">
            <span class="option-glyph-text">${opt}</span>
          </button>`;
      }).join('');

      content.innerHTML = `
        <div class="step">
          <div class="eyebrow">${s.eyebrow}</div>
          <h1>${s.title}</h1>
          <p class="step-copy">${s.copy}</p>
          <div class="option-grid ${s.grid}">${optionsHtml}</div>
        </div>`;

      content.querySelectorAll('.option-card').forEach(btn => {
        btn.addEventListener('click', () => select(s.key, btn.dataset.value));
      });

      backBtn.style.display = state.step > 0 ? 'inline-flex' : 'none';
    } else {
      const shapeLabel = state.shape ? state.shape : '';
      content.innerHTML = `
        <div class="success">
          <div class="success-badge">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F0EEE6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </div>
          <h1>All set</h1>
          <p class="success-copy">You chose <strong>${state.number}, ${state.letter}, and a ${shapeLabel}</strong>.</p>
          <button class="restart-btn" id="restart-btn">Start over</button>
        </div>`;

      document.getElementById('restart-btn').addEventListener('click', reset);
      backBtn.style.display = 'none';
    }
  }

  document.getElementById('back-btn').addEventListener('click', back);

  // Paint first, then start tracking — the selector must appear even if
  // analytics is unavailable.
  render();

  // Open the session (skipped in preview mode, so the dashboard's four
  // preview frames never create phantom sessions).
  sessionReady = startSession(false);
</script>
</body>
</html>
