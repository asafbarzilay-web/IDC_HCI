<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IDC HCI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="study-core.js"></script>
<script>
  // Isolated client: never loads or stores an auth session, so inserts
  // are always made as the anonymous role. Without this, logging into
  // the dashboard on this same origin would attach the auth session to
  // the app's inserts too — and the RLS insert policy (anon only) would
  // silently reject every event from that browser.
  //
  // Analytics must never be able to break the app itself: if the library
  // didn't load (offline, blocked CDN, opened as a file:// page), we fall
  // back to null and the selector still works, just untracked.
  var supabaseClient = null;
  try {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: false, autoRefreshToken: false }
    });
  } catch (err) {
    console.warn('Analytics disabled — could not initialise Supabase:', err);
  }
</script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #F0EEE6;
    font-family: ui-sans-serif, -apple-system, 'Segoe UI', system-ui, sans-serif;
    color: #29261F;
    -webkit-font-smoothing: antialiased;
  }

  @keyframes flowIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: none; }
  }

  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    60% { transform: scale(1.06); }
    100% { transform: scale(1); opacity: 1; }
  }

  .page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px;
  }

  .wrap { width: 100%; max-width: 560px; }

  .progress-rail {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 40px;
  }

  .progress-dot {
    height: 6px;
    border-radius: 3px;
    transition: all 0.3s ease;
    background: #D8D3C6;
    width: 12px;
  }

  .progress-dot.active {
    width: 28px;
    background: #C15F3C;
  }

  .progress-spacer { flex: 1; }

  .progress-label {
    font-size: 13px;
    color: #8A8578;
    letter-spacing: 0.02em;
  }

  .step { animation: flowIn 0.4s ease both; }

  .eyebrow {
    font-size: 13px;
    font-weight: 500;
    color: #C15F3C;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 12px;
  }

  h1 {
    font-family: Newsreader, Georgia, serif;
    font-weight: 400;
    font-size: 40px;
    line-height: 1.1;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  .step-copy {
    font-size: 16px;
    color: #6B665A;
    margin: 0 0 32px;
    line-height: 1.5;
  }

  .option-grid {
    display: grid;
    gap: 14px;
  }

  .option-grid.numbers { grid-template-columns: repeat(3, 1fr); }
  .option-grid.letters { grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .option-grid.shapes { grid-template-columns: repeat(3, 1fr); }

  .option-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    aspect-ratio: 1;
    background: #FAF9F5;
    border: 1px solid #E0DBCE;
    border-radius: 16px;
    cursor: pointer;
    font-family: inherit;
    color: #29261F;
    transition: all 0.18s ease;
    padding: 0;
  }

  .option-card:hover:not(.selected) {
    border-color: #C9A491;
    background: #FCFBF7;
    transform: translateY(-2px);
  }

  .option-card.selected {
    background: #F6E9E1;
    border-color: #C15F3C;
    box-shadow: 0 0 0 3px rgba(193, 95, 60, 0.15);
  }

  .option-glyph-text {
    font-family: Newsreader, Georgia, serif;
    line-height: 1;
  }

  .option-grid.numbers .option-glyph-text { font-size: 44px; }
  .option-grid.letters .option-glyph-text { font-size: 38px; }

  .shape-glyph.circle { width: 44px; height: 44px; border-radius: 50%; background: #4A463C; }
  .shape-glyph.square { width: 42px; height: 42px; border-radius: 6px; background: #4A463C; }
  .shape-glyph.triangle {
    width: 0; height: 0;
    border-left: 24px solid transparent;
    border-right: 24px solid transparent;
    border-bottom: 42px solid #4A463C;
  }

  .option-card.selected .shape-glyph.circle,
  .option-card.selected .shape-glyph.square { background: #C15F3C; }
  .option-card.selected .shape-glyph.triangle { border-bottom-color: #C15F3C; }

  .shape-label { font-size: 14px; color: #6B665A; }

  .success { text-align: center; animation: flowIn 0.5s ease both; }

  .success-badge {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: #C15F3C;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 28px;
    animation: pop 0.5s cubic-bezier(0.2, 0.8, 0.3, 1) both;
  }

  .success h1 { font-size: 44px; margin: 0 0 12px; }

  .success-copy {
    font-size: 17px;
    color: #6B665A;
    margin: 0 0 28px;
    line-height: 1.5;
  }

  .success-copy strong { color: #29261F; font-weight: 500; }

  .restart-btn {
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    color: #29261F;
    background: transparent;
    border: 1px solid #D8D3C6;
    border-radius: 10px;
    padding: 12px 24px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .restart-btn:hover { background: #E7E3D8; border-color: #C9C3B4; }

  .back-btn {
    margin-top: 36px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: 14px;
    color: #8A8578;
    background: transparent;
    border: none;
    cursor: pointer;
    padding: 0;
    transition: color 0.15s;
  }

  .back-btn:hover { color: #29261F; }



  /* Always reachable in free_then_tasks: the participant decides when they
     are ready, so the way in cannot be somewhere they have to find. */
  .start-tasks {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 45;
    font: inherit;
    font-size: 14px;
    background: #C15F3C;
    color: #FAF9F5;
    border: none;
    border-radius: 999px;
    padding: 11px 22px;
    cursor: pointer;
    box-shadow: 0 2px 10px rgba(41,38,31,0.12);
    transition: background 0.2s ease;
  }
  .start-tasks[hidden] { display: none; }
  .start-tasks:hover { background: #A94E2E; }

  /* The task banner and all six question types are styled by
     study-core.js, which injects them on configure. Its palette variables
     default to this app's colours, so nothing needs restating here and it
     looks exactly as it did; photo.html overrides them instead. */

  .success-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .success-actions .restart-btn:disabled { opacity: 0.55; cursor: default; }

  /* Eye tracking's consent, calibration and stop control are drawn and
     styled by study-core.js, only when a study asks for the camera. */
</style>
</head>
<body>

<div class="page">
  <div class="wrap">
    <div class="progress-rail" id="progress-rail">
      <div class="progress-dot" data-dot="0"></div>
      <div class="progress-dot" data-dot="1"></div>
      <div class="progress-dot" data-dot="2"></div>
      <div class="progress-spacer"></div>
      <div class="progress-label" id="progress-label"></div>
    </div>

    <div id="step-content"></div>

    <button class="back-btn" id="back-btn" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
      Back
    </button>
  </div>
</div>


<button class="start-tasks" id="start-tasks" hidden>Start the tasks &rarr;</button>

<script>
  const STEPS = [
    { key: 'number', eyebrow: 'Step one', title: 'Pick a number', copy: 'Choose one of the three to continue.', options: ['1', '2', '3'], grid: 'numbers' },
    { key: 'letter', eyebrow: 'Step two', title: 'Pick a letter', copy: 'Four to choose from — take your pick.', options: ['A', 'B', 'C', 'D'], grid: 'letters' },
    { key: 'shape', eyebrow: 'Step three', title: 'Pick a shape', copy: "One more and you're done.", options: [
      { id: 'circle', label: 'Circle' },
      { id: 'triangle', label: 'Triangle' },
      { id: 'square', label: 'Square' }
    ], grid: 'shapes' }
  ];

  // Preview mode: renders a single step statically (no tracking, no
  // interaction) so the dashboard can show a real screen behind its
  // heatmap dots. Activated via ?previewStep=number|letter|shape|success
  const PREVIEW_STEP_INDEX = { number: 0, letter: 1, shape: 2, success: 3 };
  const previewStepParam = new URLSearchParams(location.search).get('previewStep');
  const PREVIEW_MODE = previewStepParam in PREVIEW_STEP_INDEX;

  // What this app is, in the terms the shared core cannot work out for
  // itself: the box clicks are measured against, which screen is showing,
  // and what a click landed on. Called here, before the flags below read
  // back out of the core -- those are plain values, captured once, and
  // would otherwise capture the pre-configure defaults. The hooks
  // themselves resolve at call time and may name things declared later.
  Study.configure({
    app: 'shapes',
    screens: ['number', 'letter', 'shape', 'success'],
    content: () => document.querySelector('.wrap'),
    currentStep: () => currentStepLabel(),
    // The selector has no overlaid screens: every click belongs to the
    // step it was made on.
    currentOverlay: () => null,
    onAppScreen: () => Study.onAppScreen(),
    // The selector draws no overlays of its own; eye tracking's consent
    // and calibration are the core's, and it guards against them itself.
    overlayActive: () => false,
    hitOf: (t) => t.closest('.option-card') ? 'option'
                : t.closest('#back-btn')    ? 'back'
                : t.closest('#restart-btn') ? 'restart'
                : 'none',

    // ---- the task battery ------------------------------------------
    slots: {
      progress: () => document.getElementById('progress-rail'),
      // Questions render into the selector's own container, replacing it.
      question: () => document.getElementById('step-content')
    },

    // A fresh attempt at the selector — starting at step 0 unless the task
    // named a later entry step, so a task only about the shape screen
    // isn't forced through number and letter first. Reuses the same
    // number→index map the dashboard's previews use, since the two name
    // the same four positions. Skipped steps get a placeholder answer so
    // a run landing past them (or on 'success') still has something to
    // show rather than null — or, when the task was authored with a
    // snapshot, the answers the author actually gave on the way there.
    resetApp: (entryStep, entryState) => {
      state.step = 0; state.number = null; state.letter = null; state.shape = null;
      const idx = entryStep ? PREVIEW_STEP_INDEX[entryStep] : undefined;
      if (idx) {
        const given = entryState || {};
        state.step = idx;
        if (idx >= 1) state.number = given.number || '1';
        if (idx >= 2) state.letter = given.letter || 'A';
        if (idx >= 3) state.shape = given.shape || 'circle';
      }
      render();
    },

    // The answers given on the steps BEFORE the one being chosen on. By
    // the time the core asks, select() has already stored this choice and
    // moved state.step past it, so the step being answered is step - 1 —
    // and its own value is left out: a task starting there must not arrive
    // with the participant's answer pre-selected.
    snapshot: () => {
      const answering = state.step - 1;
      const snap = {};
      STEPS.forEach((s, i) => { if (i < answering) snap[s.key] = state[s.key]; });
      return snap;
    },

    // The Back button belongs to the selector, not to a question drawn
    // over it: left visible it would step back through a flow the
    // participant is not currently in.
    chrome: (mode) => {
      document.getElementById('back-btn').style.display =
        mode === 'app' ? '' : 'none';
    },

    // A three-step flow runs out of road once every step has an answer.
    attemptExhausted: () => state.step >= STEPS.length,

    // Left exactly where they are rather than sent back to the start.
    onRetry: () => {
      state.step = STEPS.length - 1;   // on the last step, answers intact
      render();
    },

    // Nothing of the app's own to shut down. The camera, when eye tracking
    // was on, belongs to the core, which turns it off and says so.
    onFinish: async () => 'Thanks'
  });

  // Author mode: the real app, fully interactive, but recording nothing.
  // The dashboard embeds it so a task can be defined by demonstration —
  // click the route you want and each choice is reported to the parent.
  // Demonstrating is the only way a task can name a step or option that
  // actually exists; a hand-written task drifts the moment the flow changes.
  const AUTHOR_MODE = Study.AUTHOR_MODE;

  // Question preview: renders whatever question config the dashboard posts
  // in, using the same code participants get. The builder used to draw its
  // own copy of every question type, which meant "what participants see"
  // was a promise maintained by hand — and it had already drifted once.
  const QUESTION_PREVIEW = Study.QUESTION_PREVIEW;

  // All three are observation, not participation — none may write.
  const TRACKING_OFF = Study.TRACKING_OFF;

  // Which app this file is. One database now holds two studies, and every
  // row this file writes and every setting it reads is scoped by this.
  // Stated explicitly rather than relying on the column default, so that
  // the default can eventually be dropped and a missing `app` becomes a
  // failed insert instead of a row quietly filed under the wrong study.
  const APP = 'shapes';

  function reportToAuthor(type, payload) {
    if (!AUTHOR_MODE || window.parent === window) return;
    // Same-origin only: the dashboard serves this frame, so there is no
    // reason to broadcast the study's task design more widely.
    window.parent.postMessage({ source: 'idc-hci-author', type, ...payload }, window.location.origin);
  }

  const state = { step: 0, number: null, letter: null, shape: null };
  let stepEnteredAt = Date.now();

  if (PREVIEW_MODE) {
    state.step = PREVIEW_STEP_INDEX[previewStepParam];
    if (state.step === 3) {
      state.number = '2';
      state.letter = 'B';
      state.shape = 'square';
    }
  }

  // Identity, the session lifecycle and every insert live in study-core.js
  // now. Aliased rather than called through `Study.` at each of its ~20 use
  // sites: the alias keeps those sites reading as they did, and this is the
  // one line that says where the function actually comes from.
  const write = Study.write;

  function currentStepLabel() {
    return state.step < 3 ? STEPS[state.step].key : 'success';
  }

  function select(key, value) {
    const duration_ms = Date.now() - stepEnteredAt;
    state[key] = value;
    state.step += 1;

    // One call does the four things this used to do by hand: write the
    // selection, stamp it with the task in progress, tell the task author,
    // and decide whether the route is now complete. The scoring rule moved
    // with it — the core checks after every choice rather than only when
    // the flow runs out of steps, which is the same thing here and the only
    // thing that works for an app whose screens are not a line.
    // Returns true when the battery already changed what is on screen —
    // advanced to the next task, or put them back to retry. Rendering anyway
    // would paint the selector over a question drawn in the same container.
    if (!Study.choice(key, value, duration_ms)) render();
  }

  function back() {
    state.step = Math.max(0, state.step - 1);
    render();
  }

  function reset() {
    // Start over begins a genuinely new attempt: new session row, flagged
    // as a restart so the dashboard can count them. begin() swaps the
    // session id and resets the click ordinals together — they describe one
    // attempt, and a version that reset only one of them would number the
    // new run's clicks from where the abandoned one left off.
    Study.begin(true);
    state.step = 0;
    state.number = null;
    state.letter = null;
    state.shape = null;
    reportToAuthor('reset', {});
    render();
  }


  function render() {
    stepEnteredAt = Date.now();
    if (!Study.inBattery()) {
      document.querySelectorAll('.progress-dot').forEach(dot => {
        const i = Number(dot.dataset.dot);
        dot.classList.toggle('active', i <= state.step);
      });
    }
    // In a battery the rail belongs to the battery and is already drawn;
    // free play keeps the original per-step rail.
    if (Study.inBattery()) {
      Study.renderProgress();
    } else {
      document.getElementById('progress-label').textContent =
        state.step < 3 ? `Step ${state.step + 1} of 3` : 'Complete';
    }

    const content = document.getElementById('step-content');
    const backBtn = document.getElementById('back-btn');

    if (state.step < 3) {
      const s = STEPS[state.step];
      const optionsHtml = s.options.map(opt => {
        if (s.grid === 'shapes') {
          const selected = state.shape === opt.id;
          return `
            <button class="option-card${selected ? ' selected' : ''}" data-value="${opt.id}">
              <span class="shape-glyph ${opt.id}"></span>
              <span class="shape-label">${opt.label}</span>
            </button>`;
        }
        const selected = state[s.key] === opt;
        return `
          <button class="option-card${selected ? ' selected' : ''}" data-value="${opt}">
            <span class="option-glyph-text">${opt}</span>
          </button>`;
      }).join('');

      const task = Study.currentTask();
      const retryNote = Study.routeRetry ? `
          <div class="task-retry">Not the one we asked for. Change your answer, or go back a step.</div>` : '';
      const banner = task && task.kind === 'app_route' ? `
        <div class="task-banner">
          <div class="task-banner-head">
            <div class="eyebrow">Your task</div>
            <button class="task-giveup" id="giveup-btn">I can't do this — move on</button>
          </div>
          <p>${Study.escapeHtml(task.goal_text)}</p>
          ${retryNote}
        </div>` : '';

      content.innerHTML = `
        ${banner}
        <div class="step">
          <div class="eyebrow">${s.eyebrow}</div>
          <h1>${s.title}</h1>
          <p class="step-copy">${s.copy}</p>
          <div class="option-grid ${s.grid}">${optionsHtml}</div>
        </div>`;

      content.querySelectorAll('.option-card').forEach(btn => {
        btn.addEventListener('click', () => select(s.key, btn.dataset.value));
      });

      const giveUp = document.getElementById('giveup-btn');
      if (giveUp) giveUp.addEventListener('click', () => Study.giveUp());

      backBtn.style.display = state.step > 0 ? 'inline-flex' : 'none';
    } else {
      const shapeLabel = state.shape ? state.shape : '';
      content.innerHTML = `
        <div class="success">
          <div class="success-badge">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#F0EEE6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </div>
          <h1>All set</h1>
          <p class="success-copy">You chose <strong>${state.number}, ${state.letter}, and a ${shapeLabel}</strong>.</p>
          <div class="success-actions">
            <button class="restart-btn" id="restart-btn">Start over</button>
            <button class="restart-btn" id="done-btn">I'm done</button>
          </div>
        </div>`;

      document.getElementById('restart-btn').addEventListener('click', reset);

      // Finishing should release the camera without making anyone hunt for
      // the stop control. No confirmation here: saying you are done is
      // already the decision, and there is nothing left in the run to lose.
      Study.wireDoneButton();
      backBtn.style.display = 'none';
    }
  }

  document.getElementById('back-btn').addEventListener('click', back);

  document.getElementById('start-tasks').addEventListener('click', () => {
    document.getElementById('start-tasks').hidden = true;
    // A clean run at the first task: free play leaves the selector part
    // way through, and the task should not inherit that position.
    state.step = 0; state.number = null; state.letter = null; state.shape = null;
    Study.beginTasks();
  });

  // In question preview the dashboard drives what is shown; the selector
  // never runs and no session is opened.
  if (QUESTION_PREVIEW) {
    document.getElementById('progress-rail').hidden = true;
    document.getElementById('back-btn').style.display = 'none';
    document.getElementById('step-content').innerHTML =
      '<div class="q-block"><p class="q-desc">Your question will appear here.</p></div>';

    window.addEventListener('message', (e) => {
      // Same-origin only: the dashboard serves this frame.
      if (e.origin !== window.location.origin) return;
      const m = e.data;
      if (!m || m.source !== 'idc-hci-preview') return;
      Study.renderQuestion({ kind: m.kind, goal_text: m.goal_text || '', config: m.config || {} },
                     { preview: true });
    });

    // Tell the parent we are ready, so a config posted before load is not lost.
    if (window.parent !== window) {
      window.parent.postMessage({ source: 'idc-hci-preview-ready' }, window.location.origin);
    }
  }

  // Paint first, then start tracking — the selector must appear even if
  // analytics is unavailable.
  if (!QUESTION_PREVIEW) render();

  if (!QUESTION_PREVIEW) (async () => {
    // Reads the settings and the battery, settles eye tracking if anything
    // asked for it, opens the session, and starts the battery if the mode
    // says so — in that order, because each step depends on the one before.
    const { offer } = await Study.startStudy({
      beforeSession: async () => {
        // Consent and calibration take real time, none of which is time
        // spent on step one. Restart the clock now that the study is
        // actually starting, or the first step's timing is the setup's.
        stepEnteredAt = Date.now();
      }
    });

    // They explore first and start when they say so. The control stays on
    // screen the whole time rather than appearing at some threshold we
    // decided for them.
    if (offer) document.getElementById('start-tasks').hidden = false;
  })();
</script>
</body>
</html>
